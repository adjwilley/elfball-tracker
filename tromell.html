<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1410">
<title>Tromell Counter Tracker</title>
<style>
  :root {
    --ink: #0C1410; --panel: #14201A; --panel-2: #1B2A22; --well: #0E1712;
    --edge: #27392E; --edge-soft: #1F2F26; --bone: #E6E8DF; --dim: #7E8C81;
    --moss: #7FA86B; --moss-lit: #9BC684; --amber: #E8A33D; --shadow: rgba(0,0,0,.45);
    /* Three sizes on the page, no more: primary numbers, labels/buttons, meta.
       Everything else derives from these so the page cannot drift again. */
    --fs-lg: 25px;   /* every primary number, and the turn in the top bar */
    --fs-md: 13px;   /* every label, every button */
    --fs-sm: 9.5px;  /* meta only: sick counts, sub-notes, log */
    --num: 25px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #ECEFE7; --panel: #FFFFFF; --panel-2: #F2F5EC; --well: #E7EBE0;
      --edge: #CFD6C7; --edge-soft: #E1E6DA; --bone: #16231C; --dim: #5D6B60;
      --moss: #3D7838; --moss-lit: #2E6129; --amber: #9A5F10; --shadow: rgba(20,32,26,.10);
    }
  }
  :root[data-theme="dark"] {
    --ink: #0C1410; --panel: #14201A; --panel-2: #1B2A22; --well: #0E1712;
    --edge: #27392E; --edge-soft: #1F2F26; --bone: #E6E8DF; --dim: #7E8C81;
    --moss: #7FA86B; --moss-lit: #9BC684; --amber: #E8A33D; --shadow: rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --ink: #ECEFE7; --panel: #FFFFFF; --panel-2: #F2F5EC; --well: #E7EBE0;
    --edge: #CFD6C7; --edge-soft: #E1E6DA; --bone: #16231C; --dim: #5D6B60;
    --moss: #3D7838; --moss-lit: #2E6129; --amber: #9A5F10; --shadow: rgba(20,32,26,.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    margin: 0; background: var(--ink); color: var(--bone);
    font-family: var(--sans); font-size: var(--fs-md); line-height: 1.25;
    -webkit-text-size-adjust: 100%; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
  }
  /* Flex to the device: an iPad in landscape gets the full width, which also
     buys back rows of height on the wrapping grids. */
  html, body { height: 100%; }
  /* Fills the window, both directions. One column; the panels adapt to their
     OWN width via the container queries below. */
  .wrap {
    width: 100%; max-width: 820px; margin: 0 auto;
    padding: calc(6px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px))
             calc(8px + env(safe-area-inset-bottom, 0px)) calc(10px + env(safe-area-inset-left, 0px));
    min-height: 100dvh; display: flex; flex-direction: column; gap: 5px;
  }
  .wrap > .grow { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-evenly; }
  .wrap > .grow > * { flex: 0 0 auto; }
  .panel { margin-bottom: 0; }




  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  h1 {
    font-size: var(--fs-lg); font-weight: 600; margin: 0; letter-spacing: .02em;
    color: var(--bone); font-family: var(--mono); white-space: nowrap;
  }
  h1 b { color: var(--amber); }
  .hbtns { display: flex; gap: 6px; }
  .hbtns button { padding: 8px 11px; font-size: var(--fs-md); min-height: 38px; }
  /* frequent actions (Undo / New turn) sit alone at top-right, full size;
     rare ones (Sound / New game) shrink and tuck under the turn number on the left */
  .hleft { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .hbtns.minor button { padding: 3px 8px; min-height: 24px; font-size: var(--fs-sm); color: var(--dim); border-color: var(--edge-soft); }
  .hbtns.major { margin-left: auto; }
  .hbtns.major button { padding: 10px 16px; min-height: 44px; }

  button {
    font-family: var(--sans); font-size: var(--fs-md); color: var(--bone);
    background: var(--panel-2); border: 1px solid var(--edge);
    border-radius: 9px; cursor: pointer; padding: 8px 12px;
    transition: background .1s ease, transform .06s ease;
  }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
  .primary { border-color: var(--moss); color: var(--moss-lit); font-weight: 600; }

  /* ---------- top: mana stacked left, counts stacked right ---------- */
  .top { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 0; align-content: start; }
  .tile {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 11px;
    padding: 3px 5px; box-shadow: 0 1px 2px var(--shadow);
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px;
  }
  .tile .label { font-size: var(--fs-md); letter-spacing: .04em; text-transform: uppercase; color: var(--bone);
    white-space: nowrap; flex: 0 0 126px; min-width: 0; overflow: hidden; text-align: left; }

  .val {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    line-height: 1; letter-spacing: -.02em;
  }
  .tile.derived .val { color: var(--amber); font-size: var(--fs-lg); }
  .tile.g .val { color: var(--moss-lit); }
  .tile.c .val { color: var(--bone); }

  /* the 2:1 column split leaves room for the buttons to flank the number
     at every width, phones included */
  .mrow { display: flex; flex-wrap: nowrap; justify-content: flex-start; align-items: center; gap: 5px; width: 100%; max-width: 466px; }
    /* the count never exceeds 99, so it needs little room; the buttons take the rest */
  .mrow .val { order: 2; flex: 0 0 auto; width: 40px; text-align: center; font-size: var(--fs-lg); }
  .mrow .m5 { order: 0; } .mrow .m1 { order: 1; }
  .mrow .p1 { order: 3; } .mrow .p5 { order: 4; }
  .mrow .mb {
    flex: 1 1 0; min-width: 0; max-width: 108px; height: 46px; padding: 0;
    font-family: var(--mono); font-size: var(--fs-md); color: var(--dim); border-radius: 7px;
  }
  .mrow .mb:hover { color: var(--bone); border-color: var(--moss); }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 11px;
    padding: 4px 7px 5px; margin-bottom: 4px; box-shadow: 0 1px 2px var(--shadow);
  }
  .panel h2 {
    font-size: var(--fs-md); letter-spacing: .07em; text-transform: uppercase; color: var(--moss-lit);
    margin: 0 0 2px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    min-height: 16px;
  }
  .panel h2 .tot { font-family: var(--mono); color: var(--bone); letter-spacing: 0; }

  /* ---------- counter rows ---------- */
  #rows { display: grid; grid-template-columns: 1fr; }
  /* A grid, not a flex row: the two creature rows then share column tracks, so
     every control sits at the same x on both and can be found by muscle memory. */
  /* The controls hug their number with one consistent margin; every scrap of
     slack goes to the right, where the running total sits centred in it. Fixed
     widths in the cluster keep the two rows in step with each other. */
  .crow { display: flex; align-items: center; padding: 3px 0; max-width: 600px; margin-left: auto; margin-right: auto; width: 100%; }
  .cgrp { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
  .crow + .crow { border-top: 1px solid var(--edge); margin-top: 4px; padding-top: 6px; }
  .crow > button, .cgrp > button {
    width: 48px; height: 48px; flex: 0 0 auto; padding: 0;
    font-family: var(--mono); font-size: var(--fs-lg); line-height: 1; color: var(--dim);
  }
  .crow > button:hover, .cgrp > button:hover { color: var(--bone); border-color: var(--moss); }
  .cmid { flex: 0 0 88px; width: 88px; text-align: center; }
  /* running total for the row, including tokens */
  /* The cell takes the slack so the value sits centred in it, but only the
     inner box is painted - stretching the box across the row looked absurd. */
  .rtot {
    display: flex; align-items: center; justify-content: flex-end;
    flex: 0 0 148px; margin-left: auto; overflow: hidden;
  }
  .rbox {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; padding: 2px 6px; border-radius: 8px;
    background: var(--well); border: 1px solid var(--edge-soft);
  }
  @media (max-width: 520px) {
    .cmid { flex-basis: 78px; width: 78px; }
    .rtot { flex-basis: 92px; }
    .rbox { padding: 2px 4px; }
    .cgrp { gap: 5px; }
  }
  .rtot .rtl { font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--dim);
    white-space: normal; line-height: 1.05; text-align: center; }
  .rtot .rtv {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1.05; color: var(--amber);
  }
  .cmid .nm { font-size: var(--fs-md); letter-spacing: .04em; text-transform: uppercase; color: var(--bone); font-weight: 600; }
  .cmid .n {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1.05;
  }
  .cmid .n.anth { color: var(--amber); }
  /* the section name lives in the row's own leading space, costing no height */

  .sick { font-family: var(--mono); font-size: var(--fs-sm); color: var(--dim); min-height: 11px; line-height: 1.15; }
  .sick.on { color: var(--amber); }

  /* ---------- token rows ---------- */
  /* Spare width is split four ways by the auto margins below, giving:
     margin | - card + | space | tap/untap | space | card | margin
     (a flex item's auto margins share out the free space equally). */
  #tokens { display: grid; grid-template-columns: 1fr; gap: 4px; }
  /* Three groups: the pile with its own +/- buttons, the tap controls, and the
     tapped pile. Space GROWS between the groups and never inside them, so the
     buttons stay welded to the card they change. */
  .trow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1px 0; width: 100%;
  }
  .tgrp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .trow > .tapbtns { margin: 0 clamp(8px, 2.4vw, 26px); }
  /* [- card +] hugs the untapped pile; [tap/untap][tapped card] hugs the
     tapped pile; the slack sits between the two groups, not inside them. */

  .trow + .trow { margin-top: 4px; border-top: 1px solid var(--edge-soft); padding-top: 4px; }
  /* Landscape earns a wider column and the two-up token layout; portrait keeps
     a single comfortable column and spends the extra width on side margins. */
  /* The tokens panel decides for itself: two-up only when ITS OWN box is wide
     enough, which is true in the single-column layout and false in a column. */
  @media (min-width: 900px) and (orientation: landscape) {
    #tokens { grid-template-columns: 1fr 1fr; column-gap: clamp(28px, 5vw, 72px); }
    .trow + .trow { margin-top: 0; border-top: none; padding-top: 0; border-left: 1px solid var(--edge-soft); padding-left: 16px; }
  }
  .trow > button {
    width: 42px; height: 46px; flex: 0 0 auto; padding: 0;
    font-family: var(--mono); font-size: var(--fs-lg); line-height: 1; color: var(--dim);
  }
  .trow > button:hover { color: var(--bone); border-color: var(--moss); }

  .card {
    flex: 0 0 auto; border-radius: 7px; padding: 3px;
    border: 1.5px solid var(--edge); background: var(--panel-2);
    display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 3px var(--shadow);
  }
  .card .bar { height: 6px; border-radius: 2px; background: var(--edge); flex: 0 0 auto; }
  .card .win {
    flex: 1; border-radius: 3px; background: var(--well); border: 1px solid var(--edge-soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card .cn {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1;
  }
  .card .cl { display: none; }
  /* Token art sits in the card's art window, behind the count. A radial
     scrim darkens the middle so the number stays legible without washing
     out the edges of the painting. */
  .card .win { background-size: cover; background-position: center; }
  .card.art-elf .win {
    background-image:
      radial-gradient(ellipse at center, rgba(6,14,9,.50) 0%, rgba(6,14,9,.24) 60%, rgba(6,14,9,.08) 100%),
  }
  .card.art-tre .win {
    background-image:
      radial-gradient(ellipse at center, rgba(6,14,9,.50) 0%, rgba(6,14,9,.24) 60%, rgba(6,14,9,.08) 100%),
  }
  /* fixed light inks: the numbers now sit on artwork, not on the panel */
  .card .cn {
    color: #EFF6EA;
    text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,.95), 0 0 11px rgba(0,0,0,.75);
  }
  .card.up .cn { color: #BCE7A0; }
  .card .win .sick { color: #FFD27A; text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,.9); }
  .card.up { width: 50px; height: 70px; border-color: var(--moss); }
  .card.up .bar { background: color-mix(in srgb, var(--moss) 55%, transparent); }
  /* An empty pile fades its count and frame, but the type line stays at
     full strength so you can always tell which card the slot is for. */
  .card.zero .bar { opacity: .3; }
  .card.zero .cn { opacity: 0; }        /* empty: the art alone says "none" */
  .card.up.zero { border-color: var(--edge); }

  /* A tapped card is literally the untapped card rotated 90deg clockwise -
     identical markup and proportions, so the bar and type line ride around
     with it. The wrapper reserves the swapped footprint in the layout, and
     the number counter-rotates so it stays readable at a glance. */
  .tapwrap { position: relative; flex: 0 0 auto; width: 70px; height: 50px; }
  .card.tap {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 70px;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  .card.tap .cn { color: #D2DACE; transform: rotate(-90deg); }

  .tapbtns { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }

  .tapbtns button { width: 48px; height: 34px; padding: 0; font-size: var(--fs-lg); line-height: 1; color: var(--dim); }
  .tapbtns button:hover { color: var(--bone); border-color: var(--moss); }

  .hint { display: none; }

  /* ---------- wide: buttons flank the numbers, counters go side by side ---------- */
  /* Wide screens get roomier controls, not a second type scale. */
  @media (min-width: 560px) {
    :root { --fs-lg: 28px; --fs-md: 14px; --fs-sm: 10px; --num: 28px; }
    .mrow { gap: 6px; max-width: 450px; }
    .mrow .mb { height: 48px; }
    .mrow .val { width: 50px; }
    .tile .label { flex-basis: 142px; }
    .crow > button, .cgrp > button { width: 58px; height: 56px; }
    .cmid { flex-basis: 96px; width: 96px; }
    .card.up { width: 62px; height: 86px; }
    .tapwrap { width: 86px; height: 62px; }
    .card.tap { width: 62px; height: 86px; }
    .trow > button { width: 48px; height: 56px; }
    .tapbtns button { width: 54px; height: 40px; }
  }

  /* ---------- tracked permanents ---------- */
  /* flex-wrap with a small basis: one row on a tablet, two or three on a
     phone, without a media query fighting the card widths. */
  .perms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  @media (min-width: 360px) { .perms { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 700px) { .perms { grid-template-columns: repeat(5, 1fr); } }
  /* A wide, short chip can only ever show a thin band of a tall illustration,
     so extra height is the only real way to zoom the crop out. */
  .perm {
    min-width: 0; min-height: 90px;
    background: var(--panel-2); border: 1px solid var(--edge); border-radius: 8px;
    padding: 3px 3px 4px; display: flex; flex-direction: column; align-items: center; gap: 0;
    position: relative; overflow: hidden; justify-content: space-between;
  }
  /* Card art sits behind each chip as a landscape watermark. The name stays at
     full strength so an OFF permanent is still readable at a glance. */
  .perm::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-size: cover; background-position: center 28%; opacity: .78;
  }
  /* Off keeps its colour - it just sits back a little. The border and the
     greyed value are what say "not on the battlefield". */
  .perm.off::before { opacity: .42; }
  .perm::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(12,20,16,.58) 0%, rgba(12,20,16,.10) 42%, rgba(12,20,16,.66) 100%);
  }
  .perm .pn, .perm .pv, .perm .ps, .perm .pmid {
    text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.6);
  }
  .perm .pmb { background: rgba(12,20,16,.42); backdrop-filter: blur(1px); }
  .perm.off { opacity: 1; }
  .perm.on { border-color: var(--moss); }
  .perm.off .pv, .perm.off .ps { color: var(--dim); }
  .perm .pn {
    font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--bone);
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    width: 100%; position: relative; z-index: 1;
  }
  .perm.on .pn { color: #EFF6EA; }
  .perm .pv {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1.05; color: var(--amber); position: relative; z-index: 1;
  }
  .perm.off .pv { color: var(--dim); }
  .perm .ps {
    font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--dim);
    min-height: 0; line-height: 1.1; position: relative; z-index: 1;
  }
  .perm .ps b { color: var(--moss-lit); font-weight: 600; }
  .perm .ps s { color: var(--edge); text-decoration: none; }
  /* The card IS the switch - tapping the body toggles it. The counter
     buttons flank the number and swallow the click so they never toggle. */
  .perm { cursor: pointer; }
  .perm:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .perm .pmid { display: flex; align-items: center; justify-content: center; gap: 2px; width: 100%; }
  .perm .pmb {
    flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border-radius: 6px;
    font-family: var(--mono); font-size: var(--fs-md); line-height: 1; color: var(--dim);
    background: transparent; border-color: var(--edge-soft);
  }
  .perm .pmb:hover { color: var(--bone); border-color: var(--moss); }
  .perm .pmid .pv { flex: 1 1 auto; text-align: center; }

  /* ---------- per-turn statistics ---------- */
  /* Two ways a creature arrives. Cast fires Lys Alana Huntmaster; put does not. */
  .addwrap { display: flex; gap: 7px; flex: 0 0 auto; }
  .addb {
    width: 48px; height: 48px; padding: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0; line-height: 1;
  }
  .addb .ab { font-family: var(--mono); font-size: var(--fs-lg); color: var(--dim); }
  .addb .al { font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .addb:hover { border-color: var(--moss); }
  .addb:hover .ab, .addb:hover .al { color: var(--bone); }

  /* One line, not a row of tiles: these are numbers you glance at, not press. */
  .turnline {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; font-size: var(--fs-md);
  }
  .turnline .tl-lab {
    color: var(--moss-lit); text-transform: uppercase; letter-spacing: .07em;
    font-weight: 600; white-space: nowrap;
  }
  .turnline .tl-it {
    color: var(--dim); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
  }
  .turnline b {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; padding-left: 6px;
  }
  .turnline .dn { padding-left: 8px; }
  .turnline .up { color: var(--moss-lit); }
  .turnline .dn { color: #D98A8A; }

  /* ---------- by-turn log ---------- */
  .logbox { max-height: 30px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .logline {
    font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.45; color: var(--dim);
    white-space: nowrap; overflow-x: auto;
  }
  .logline b { color: var(--bone); font-weight: 600; }
  .logline .up { color: var(--moss-lit); }
  .logline .dn { color: #D98A8A; }
  .logline.cur { color: var(--bone); }
  .logempty { font-size: var(--fs-sm); color: var(--dim); text-align: center; padding: 4px 0; }

  /* ---------- change feedback ---------- */
  /* Floaters live in a fixed overlay and are positioned from each target's
     bounding box, so no ancestor needs position:relative. */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .flt {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-weight: 700; font-size: calc(var(--fs-lg) * 1.35); line-height: 1;
    text-shadow: 0 2px 6px rgba(0,0,0,.6); white-space: nowrap;
    animation: fltfade 5s ease-out forwards;
  }
  .flt.pos { color: rgba(155, 198, 132, .92); }
  .flt.neg { color: rgba(226, 138, 138, .92); }
  .flt.zero { color: rgba(126, 140, 129, .8); }
  @keyframes fltfade {
    0%   { opacity: 0;   transform: translate(-50%, -30%) scale(.7); }
    6%   { opacity: .95; transform: translate(-50%, -60%) scale(1.12); }
    16%  { opacity: .92; transform: translate(-50%, -74%) scale(1); }
    70%  { opacity: .8;  transform: translate(-50%, -104%) scale(1); }
    100% { opacity: 0;   transform: translate(-50%, -150%) scale(.96); }
  }
  /* labelled one-off, e.g. "+1 treasure" from Gala Greeters */
  .flt.note { font-size: var(--fs-md); font-weight: 600; letter-spacing: .01em; }
  .flt.note.manual { color: rgba(232,163,61,.95); }
  .glowing { animation: glowpulse 1.5s ease-out; border-radius: 8px; }
  .glowing.neg { animation-name: glowpulseneg; }
  @keyframes glowpulse {
    0%   { box-shadow: 0 0 0 0 rgba(155,198,132,.0); }
    18%  { box-shadow: 0 0 13px 3px rgba(155,198,132,.55); }
    100% { box-shadow: 0 0 0 0 rgba(155,198,132,0); }
  }
  @keyframes glowpulseneg {
    0%   { box-shadow: 0 0 0 0 rgba(226,138,138,.0); }
    18%  { box-shadow: 0 0 13px 3px rgba(226,138,138,.55); }
    100% { box-shadow: 0 0 0 0 rgba(226,138,138,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .flt { animation: fltfadeplain 4.6s linear forwards; }
    @keyframes fltfadeplain { 0%,78% { opacity: .9; } 100% { opacity: 0; } }
    .glowing, .glowing.neg { animation: none; }
  }

  button[disabled] { opacity: .35; cursor: default; }
  button[disabled]:active { transform: none; }

  @media (min-width: 560px) {
    .perm { min-height: 100px; }
    .logbox { max-height: 32px; }
    .addb { width: 58px; height: 56px; }
  }
  /* Room to breathe at the edges once the window is wide - the minus buttons
     should not sit hard against the frame. */
  @media (min-width: 900px) {
    .panel { padding-left: 20px; padding-right: 20px; }
    .tile { padding-left: 16px; padding-right: 16px; }
    .wrap { padding-left: 16px; padding-right: 16px; }
  }

  /* ---------- token detail view ----------
     A full-screen layer inside the same file, not a second page: the tracker
     has to stay one self-contained document so it works offline and copies
     cleanly between devices. history.pushState wires it to the back gesture. */
  #detail {
    position: fixed; inset: 0; z-index: 40; background: var(--ink);
    overflow-y: auto; -webkit-overflow-scrolling: touch; display: none;
    padding: calc(6px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px))
             calc(24px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px));
  }
  #detail > * { max-width: 1000px; margin-left: auto; margin-right: auto; }
  body.detail-open #detail { display: block; }
  body.detail-open .wrap { display: none; }
  #detail header { position: sticky; top: 0; background: var(--ink); padding: 2px 0 6px; z-index: 2; }
  /* a little extra breathing room under the status bar: iOS treats the top few
     pixels as the notification pull-down zone, so taps there get swallowed */
  @supports (padding: env(safe-area-inset-top)) {
    @media (display-mode: standalone) { .wrap { padding-top: calc(14px + env(safe-area-inset-top, 0px)); } }
  }
  #detail .dsum { font-family: var(--mono); font-size: var(--fs-sm); color: var(--dim); }
  #detail .dsum b { color: var(--bone); }

  /* Roomy square cells: a card has to be able to rotate inside one, and the
     extra gap makes them tappable without magnifying. */
  .tokgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 11px; }
  .tokcell { position: relative; height: 104px; border-radius: 10px; }
  .tokcell:active { background: rgba(127,168,107,.07); }

  /* The face reuses .card / .art-elf so it carries the same artwork and inks
     as the board screen. Tapped is shown the way the board screen shows it -
     the card lies on its side - so there is nothing to read. */
  .tokgrid .card {
    position: absolute; top: 50%; left: 50%; width: 58px; height: 82px;
    transform: translate(-50%, -50%); transition: transform .16s ease;
  }
  .tokcell.tapped .card { transform: translate(-50%, -50%) rotate(90deg); border-color: var(--edge); }
  .tokgrid .card .win { border-radius: 3px; }
  .tokgrid .card .cn { font-size: var(--fs-md); transition: transform .16s ease; }
  .tokcell.tapped .card .cn { transform: rotate(-90deg); color: #D2DACE; }
  .tokcell.tapped .card .bar { opacity: .35; }
  @media (prefers-reduced-motion: reduce) {
    .tokgrid .card, .tokgrid .card .cn { transition: none; }
  }

  /* Summoning sickness: an amber pip on the cell, so it does not ride around
     when the card rotates. No label. */
  .tokcell.sick::after {
    content: ""; position: absolute; top: 6px; left: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px rgba(232,163,61,.85);
    z-index: 3; pointer-events: none;
  }
  .tokcell .tctr {
    position: absolute; left: 5px; bottom: 5px; z-index: 3; pointer-events: none;
    font-family: var(--mono); font-size: var(--fs-sm); line-height: 1; color: var(--amber);
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  /* Invisible hit zones sit over the cell and never rotate, so "top" always
     means add a counter no matter which way the card is lying. */
  .tzone {
    position: absolute; left: 0; right: 0; height: 30px; z-index: 2; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: var(--fs-md); line-height: 1; color: var(--dim);
    opacity: .55;
  }
  .tzone.tup { top: 0; }
  .tzone.tdn { bottom: 0; }

  /* ===== Tromell mode additions ===== */
  .indic { background: var(--panel); border: 1px solid var(--moss); border-radius: 11px; padding: 8px 10px; }
  .indic .big { font-family: var(--mono); font-size: var(--fs-lg); color: var(--amber); }
  .indic .sub { font-size: var(--fs-sm); color: var(--dim); margin-top: 2px; line-height: 1.4; }
  .indic .sub b { color: var(--moss-lit); font-weight: 600; }
  .enter { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .enter button { flex: 1 1 auto; min-height: 38px; }
  .enter select { flex: 2 1 160px; min-height: 38px; background: var(--panel-2); color: var(--bone); border: 1px solid var(--edge); border-radius: 8px; font-size: var(--fs-md); padding: 0 8px; }
  .cgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  @media (min-width: 420px) { .cgrid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 760px) { .cgrid { grid-template-columns: repeat(4, 1fr); } }
  .ccard { position: relative; overflow: hidden; border: 1px solid var(--edge); border-radius: 8px; background: var(--panel-2); min-height: 96px; padding: 3px 4px 4px; display: flex; flex-direction: column; justify-content: space-between; }
  .ccard::before { content: ""; position: absolute; inset: 0; background-size: cover; background-position: center 30%; opacity: .62; z-index: 0; }
  .ccard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,20,16,.62) 0%, rgba(12,20,16,.08) 45%, rgba(12,20,16,.72) 100%); z-index: 0; }
  .ccard > * { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,.9); }
  .ccard.tapped { border-color: var(--amber); }
  .ccard.tapped::before { filter: grayscale(.5); opacity: .45; }
  .ccard .nm { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .04em; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ccard .pt { font-family: var(--mono); font-size: var(--fs-lg); color: #EFF6EA; text-align: center; }
  .ccard .pt small { font-size: var(--fs-sm); color: var(--amber); margin-left: 4px; }
  .ccard .pt .sk { color: #FFD27A; font-size: var(--fs-sm); margin-left: 4px; }
  .ccard .ctl { display: flex; gap: 3px; justify-content: center; align-items: center; }
  .ccard .ctl button { min-height: 28px; min-width: 30px; padding: 2px 6px; font-size: var(--fs-md); background: rgba(12,20,16,.55); }
  .ccard .ctl .cv { font-family: var(--mono); color: var(--moss-lit); min-width: 26px; text-align: center; font-size: var(--fs-md); }
  .ccard .x { position: absolute; top: 2px; right: 4px; font-size: var(--fs-sm); color: var(--dim); background: none; border: none; padding: 2px 4px; min-height: 0; }
  .ccard .tapb { position: absolute; top: 2px; left: 4px; font-size: var(--fs-sm); background: none; border: none; padding: 2px 4px; min-height: 0; color: var(--bone); }
  .mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  @media (min-width: 560px) { .mods { grid-template-columns: repeat(5, 1fr); } }
  .mods .perm { min-height: 72px; cursor: pointer; }
  .mods .perm .pv { font-family: var(--mono); font-size: var(--fs-md); color: var(--amber); position: relative; z-index: 1; }
  .mods .perm .ps { font-size: var(--fs-sm); color: var(--dim); position: relative; z-index: 1; text-align: center; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts button { flex: 1 1 30%; min-height: 40px; }
  .acts button.primary { flex-basis: 100%; min-height: 46px; font-size: var(--fs-lg); }
  .anth { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: var(--fs-md); color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .anth b { font-family: var(--mono); color: var(--moss-lit); font-size: var(--fs-lg); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet.open { display: flex; }
  .sheet .box { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px 14px 0 0; padding: 12px; width: 100%; max-width: 640px; max-height: 80vh; overflow-y: auto; }
  .sheet h3 { margin: 0 0 8px; font-size: var(--fs-md); color: var(--bone); text-transform: uppercase; letter-spacing: .06em; }
  .sheet .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .sheet .opts button { min-height: 44px; text-align: left; padding: 6px 10px; }
  .sheet .opts button.primary { grid-column: 1 / -1; }
  .sheet .close { width: 100%; margin-top: 10px; min-height: 40px; }
  .mana-note { font-size: var(--fs-sm); color: var(--dim); text-align: center; margin-top: 4px; }
  .mana-note b { color: var(--moss-lit); }
</style>
</head>
<body>

<div class="wrap">
  <header class="a-hdr">
    <div class="hleft">
      <h1 id="turnTop">Turn 1</h1>
      <div class="hbtns minor">
        <button id="modeBtn" aria-label="Switch deck">Tromell</button>
        <button id="newgame" aria-label="New game">New game</button>
      </div>
    </div>
    <div class="hbtns major">
      <button id="undo">Undo</button>
      <button class="primary" id="newturn">New turn</button>
    </div>
  </header>

  <div class="panel turnline a-turn">
    <span class="tl-lab">This turn (<span id="turnNo">1</span>):</span>
    <span class="tl-it">Entered <b class="up" id="fx-cIn">0</b></span>
    <span class="tl-it">Counters placed <b class="up" id="fx-ctr">+0</b></span>
    <span class="tl-it">Life <b class="up" id="fx-life">+0</b></span>
  </div>

  <div class="indic">
    <div class="big" id="indicBig">Next creature enters with 0</div>
    <div class="sub" id="indicSub"></div>
    <div class="enter">
      <select id="enterPick" aria-label="Which creature enters"></select>
      <button class="primary" id="enterBtn">Enters</button>
      <button id="enterX" aria-label="Enters with X counters">Hydra (X)</button>
    </div>
  </div>

  <div class="top a-mana">
    <div class="tile g">
      <span class="label">Green mana</span>
      <div class="mrow">
        <button type="button" class="mb m5" data-mana="green" data-d="-5">&minus;5</button>
        <button type="button" class="mb m1" data-mana="green" data-d="-1">&minus;1</button>
        <span class="val" id="green">0</span>
        <button type="button" class="mb p1" data-mana="green" data-d="1">+1</button>
        <button type="button" class="mb p5" data-mana="green" data-d="5">+5</button>
      </div>
      <div class="mana-note" id="manaNote"></div>
    </div>
    <div class="tile c">
      <span class="label">Colorless mana</span>
      <div class="mrow">
        <button type="button" class="mb m5" data-mana="colorless" data-d="-5">&minus;5</button>
        <button type="button" class="mb m1" data-mana="colorless" data-d="-1">&minus;1</button>
        <span class="val" id="colorless">0</span>
        <button type="button" class="mb p1" data-mana="colorless" data-d="1">+1</button>
        <button type="button" class="mb p5" data-mana="colorless" data-d="5">+5</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="acts">
      <button class="primary" id="prolif">Proliferate</button>
      <button id="actKalonian">Kalonian attacks</button>
      <button id="actOuro">Ouroboroid combat</button>
      <button id="actSeymour">Seymour combat</button>
      <button id="actLand">Land drop</button>
      <button id="actBill">Bristly Bill double</button>
      <button id="actAll">+N to all</button>
      <button id="actOne">+N to one</button>
      <button id="actUntap">Untap all</button>
    </div>
  </div>

  <div class="panel grow">
    <h2><span>Creatures</span><span id="cCount" style="color:var(--dim);font-size:var(--fs-sm)"></span></h2>
    <div class="cgrid" id="cgrid"></div>
  </div>

  <div class="panel">
    <h2><span>Counter modifiers</span></h2>
    <div class="mods" id="mods"></div>
    <div class="anth" style="margin-top:8px">Elf anthem
      <button type="button" id="anthDn" style="min-height:30px">&minus;</button><b id="anthVal">+0</b><button type="button" id="anthUp" style="min-height:30px">+</button>
      <span id="anthNote" style="font-size:var(--fs-sm)"></span>
    </div>
  </div>

  <div class="panel a-log">
    <h2><span>By turn</span></h2>
    <div class="logbox" id="logbox"></div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="box"><h3 id="sheetTitle"></h3><div class="opts" id="sheetOpts"></div><button class="close" id="sheetClose">Cancel</button></div></div>

  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }

  /* ---------- derived ---------- */
  function has(k) { for (var i = 0; i < s.board.length; i++) if (s.board[i].k === k) return s.board[i]; return null; }
  function count(k) { var c = 0; for (var i = 0; i < s.board.length; i++) if (s.board[i].k === k) c++; return c; }
  function elfAnthem() { var j = has("joraga"); return s.anthem + (j ? j.c : 0) + count("archdruid"); }
  function pow(b) { var C = CARDS[b.k]; return C.p + b.c + (C.elf && b.k !== "joraga" ? elfAnthem() - (b.k === "archdruid" ? 1 : 0) : 0) + (b.k === "weave" ? s.ts.weave : 0) + (b.k === "renata" ? devotion() : 0); }
  function tough(b) { var C = CARDS[b.k]; return C.t + b.c + (C.elf && b.k !== "joraga" ? elfAnthem() - (b.k === "archdruid" ? 1 : 0) : 0) + (b.k === "weave" ? s.ts.weave : 0); }
  function devotion() { return 0; }   // Renata's power: set by hand via counters if it matters
  function adders() { return s.mods.scales + s.mods.spire + count("mike") + count("kami"); }
  function doublers() { return s.mods.crystal + s.mods.branch + s.mods.season + (s.mods.innkeeper >= 3 ? 1 : 0) + count("vorinclex"); }
  // THE formula. Adders before doublers: the ruling on every one of these
  // cards says you choose the order, and (n+1)*2 beats n*2+1.
  function place(k) { if (k <= 0) return 0; return (k + adders()) * Math.pow(2, doublers()); }
  function elves() { var c = 0; for (var i = 0; i < s.board.length; i++) if (CARDS[s.board[i].k].elf) c++; return c; }
  function greatestPower() { var g = 0; for (var i = 0; i < s.board.length; i++) g = Math.max(g, pow(s.board[i])); return g; }

  // What a creature entering now picks up, split into the ENTER event and the
  // triggers that fire afterwards (each trigger is its own placement).
  function entryPlan(k, xCtr) {
    var C = CARDS[k], base = (C.enter || 0) + (xCtr || 0), src = [];
    if (k !== "tromell" && has("tromell")) { base += 1; src.push("Tromell +1"); }
    var a = has("arwen"); if (a && k !== "arwen") { var at = tough(a); base += at; src.push("Arwen +" + at); }
    var r = has("renata"); if (r && k !== "renata") { base += count("renata"); src.push("Renata +" + count("renata")); }
    var enter = place(base);
    var trig = [];
    var w = has("warden"); if (w && k !== "warden" && w.c > 0) trig.push({ who: "self", n: place(w.c), lab: "Warden endure " + place(w.c) });
    if (s.mods.henge) trig.push({ who: "self", n: place(1), lab: "Henge +" + place(1) + " & draw" });
    if (has("champion") && k !== "champion") trig.push({ who: "champion", n: place(1), lab: "Champion +" + place(1) });
    if (has("marwyn") && C.elf && k !== "marwyn") trig.push({ who: "marwyn", n: place(1), lab: "Marwyn +" + place(1) });
    if (has("gyre") && k !== "gyre") trig.push({ who: "gyre", n: place(1), lab: "Gyre evolve +" + place(1) + " (if bigger)" , maybe: 1 });
    return { base: base, enter: enter, src: src, trig: trig };
  }

  /* ---------- state changes ---------- */
  function act(fn) { hist.push(JSON.stringify(s)); if (hist.length > HIST_MAX) hist.shift(); fn(); save(); render(); }
  function undo() { if (!hist.length) return; s = JSON.parse(hist.pop()); save(); render(); }
  function give(b, k) { var got = place(k); b.c += got; s.ts.ctr += got; return got; }

  function enter(k, xCtr) {
    act(function () {
      var plan = entryPlan(k, xCtr), C = CARDS[k];
      var b = { k: k, c: 0, t: 0, s: 1 };
      b.c = plan.enter; s.ts.ctr += plan.enter;
      s.board.push(b);
      s.ts.cIn++; s.ts.ntIn++; s.ts.oranNew++;
      plan.trig.forEach(function (tr) {
        if (tr.maybe) {   // Gyre Sage evolve: only if the entrant is bigger in P or T
          var g = has("gyre"); if (!g) return;
          if (!(pow(b) > pow(g) || tough(b) > tough(g))) return;
          b.c += 0; give(g, 1); return;
        }
        if (tr.who === "self") { b.c += tr.n; s.ts.ctr += tr.n; }
        else { var tgt = has(tr.who); if (tgt) { tgt.c += tr.n; s.ts.ctr += tr.n; } }
      });
      if (has("weave") && C.elf && k !== "weave") s.ts.weave++;
      if (has("essence")) s.ts.life++;
      var g = has("gala");
      if (g) {
        if (s.ts.galaMode === 0) { s.ts.galaMode = 1; }                 // treasure: track by hand (colorless tile)
        else if (s.ts.galaMode === 1) { s.ts.galaMode = 2; s.ts.life += 2; }
        else if (s.ts.galaMode === 2) { s.ts.galaMode = 3; give(g, 1); }
      }
    });
  }
  function proliferate(times) {
    act(function () {
      for (var t = 0; t < times; t++) for (var i = 0; i < s.board.length; i++) if (s.board[i].c > 0) give(s.board[i], 1);
      if (s.mods.ozolith && s.mods.ozBank > 0) s.mods.ozBank += times;
    });
  }
  function eachWithCounters(fn) { for (var i = 0; i < s.board.length; i++) if (s.board[i].c > 0) fn(s.board[i]); }

  /* ---------- sheet (choice popup) ---------- */
  var sheetEl = document.getElementById("sheet");
  function ask(title, opts) {
    document.getElementById("sheetTitle").textContent = title;
    var host = document.getElementById("sheetOpts"); host.innerHTML = "";
    opts.forEach(function (o) {
      var x = document.createElement("button"); x.type = "button"; x.textContent = o.label; if (o.primary) x.className = "primary";
      x.addEventListener("click", function () { sheetEl.classList.remove("open"); o.fn(); });
      host.appendChild(x);
    });
    sheetEl.classList.add("open");
  }
  document.getElementById("sheetClose").addEventListener("click", function () { sheetEl.classList.remove("open"); });
  function askNumber(title, fn) {
    var v = prompt(title, "1"); if (v === null) return; v = n(v); if (v > 0) fn(v);
  }
  function askCreature(title, fn) {
    if (!s.board.length) return;
    ask(title, s.board.map(function (b, i) { return { label: CARDS[b.k].name + "  (" + pow(b) + "/" + tough(b) + ")", fn: function () { fn(i); } }; }));
  }

  /* ---------- render ---------- */
  function el(t, c) { var d = document.createElement(t); if (c) d.className = c; return d; }
  function btn(txt, fn, cls, aria) { var x = document.createElement("button"); x.type = "button"; x.textContent = txt; if (cls) x.className = cls; if (aria) x.setAttribute("aria-label", aria); x.addEventListener("click", function (e) { e.stopPropagation(); fn(); }); return x; }
  function art(node, name) { if (ART[name]) node.style.setProperty("--art", "url(" + ART[name] + ")"); }

  function renderIndic() {
    var pe = entryPlan("elf"), po = entryPlan("other");
    var big = "Next Elf enters with " + pe.enter + (po.enter !== pe.enter ? " \xb7 non-Elf " + po.enter : "");
    if (!has("tromell")) big = "Tromell not on the battlefield \u2014 " + big.toLowerCase();
    document.getElementById("indicBig").textContent = big;
    var parts = [];
    parts.push("base " + pe.base + (pe.src.length ? " (" + pe.src.join(", ") + ")" : "") + " \u2192 <b>" + pe.enter + "</b> after +" + adders() + " and \xd7" + Math.pow(2, doublers()));
    if (pe.trig.length) parts.push("then " + pe.trig.map(function (t) { return "<b>" + t.lab + "</b>"; }).join(", "));
    parts.push("Proliferate adds <b>" + place(1) + "</b> to each countered creature" + (has("tromell") ? ", X = <b>" + s.ts.ntIn + "</b> this turn" : ""));
    document.getElementById("indicSub").innerHTML = parts.join("<br>");
  }
  function renderBoard() {
    var host = document.getElementById("cgrid"); host.innerHTML = "";
    s.board.forEach(function (b, i) {
      var C = CARDS[b.k], c = el("div", "ccard" + (b.t ? " tapped" : ""));
      if (ART[C.name]) c.style.setProperty("background-image", "none");
      var pre = el("div"); // art via inline style on a pseudo is impossible; use a real layer
      pre.style.cssText = "position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:.62;z-index:0;" + (b.t ? "filter:grayscale(.5);opacity:.45;" : "");
      if (ART[C.name]) pre.style.backgroundImage = "url(" + ART[C.name] + ")";
      c.appendChild(pre);
      var nm = el("div", "nm"); nm.textContent = C.name; c.appendChild(nm);
      var pt = el("div", "pt"); pt.innerHTML = pow(b) + "/" + tough(b) + (b.c ? "<small>+" + b.c + "</small>" : "") + (b.s ? '<span class="sk">\u25cf</span>' : ""); c.appendChild(pt);
      var ctl = el("div", "ctl");
      ctl.appendChild(btn(MINUS, function () { act(function () { if (b.c > 0) { b.c--; } }); }, "", "Remove a counter"));
      var cv = el("span", "cv"); cv.textContent = b.c; ctl.appendChild(cv);
      ctl.appendChild(btn("+", function () { act(function () { give(b, 1); }); }, "", "Add a counter (modified)"));
      ctl.appendChild(btn("+1", function () { act(function () { b.c++; }); }, "", "Add exactly one counter, unmodified"));
      c.appendChild(ctl);
      c.appendChild(btn(b.t ? "untap" : TAP, function () { act(function () { b.t = b.t ? 0 : 1; }); }, "tapb", "Tap or untap"));
      c.appendChild(btn(CROSS, function () { act(function () {
        if (s.mods.ozolith && b.c > 0) s.mods.ozBank += b.c;   // The Ozolith keeps the counters
        s.board.splice(i, 1);
      }); }, "x", "Leaves the battlefield"));
      host.appendChild(c);
    });
    document.getElementById("cCount").textContent = s.board.length + " creatures \xb7 " + elves() + " elves";
  }
  function renderMods() {
    var host = document.getElementById("mods"); host.innerHTML = "";
    MODS.forEach(function (m) {
      var on = s.mods[m.key] > 0, c = el("div", "perm " + (on ? "on" : "off"));
      var pre = el("div"); pre.style.cssText = "position:absolute;inset:0;background-size:cover;background-position:center 28%;opacity:" + (on ? ".78" : ".42") + ";z-index:0;";
      if (ART[m.name]) pre.style.backgroundImage = "url(" + ART[m.name] + ")"; c.appendChild(pre);
      var nm = el("div", "pn"); nm.textContent = m.name; c.appendChild(nm);
      var pv = el("div", "pv"), ps = el("div", "ps");
      if (m.kind === "adder") { pv.textContent = on ? "+1" : "\u2013"; ps.textContent = "per placement"; }
      else if (m.kind === "doubler") { pv.textContent = on ? "\xd72" : "\u2013"; ps.textContent = "per placement"; }
      else if (m.kind === "level") { pv.textContent = on ? "L" + s.mods.innkeeper : "\u2013"; ps.textContent = s.mods.innkeeper >= 3 ? "\xd72 counters" : (s.mods.innkeeper === 2 ? "ward 1" : "+1 each combat"); }
      else if (m.kind === "bank") { pv.textContent = on ? s.mods.ozBank + " banked" : "\u2013"; ps.textContent = "tap: move to a creature"; }
      else if (m.kind === "land") { pv.textContent = on ? "on" : "\u2013"; ps.textContent = m.key === "oranrief" ? "ctr on new greens" : "4,T: proliferate"; }
      else { pv.textContent = on ? "on" : "\u2013"; ps.textContent = "+1 & draw per creature"; }
      c.appendChild(pv); c.appendChild(ps);
      c.addEventListener("click", function () {
        if (m.kind === "level") { act(function () { s.mods.innkeeper = (s.mods.innkeeper + 1) % 4; }); return; }
        if (m.kind === "bank" && on) {
          ask("The Ozolith", [
            { label: "Move " + s.mods.ozBank + " counters onto a creature", primary: 1, fn: function () { askCreature("Onto which creature?", function (i) { act(function () { var g = place(s.mods.ozBank); s.board[i].c += g; s.ts.ctr += g; s.mods.ozBank = 0; }); }); } },
            { label: "Bank: set number by hand", fn: function () { askNumber("Counters on The Ozolith", function (v) { act(function () { s.mods.ozBank = v; }); }); } },
            { label: "The Ozolith leaves", fn: function () { act(function () { s.mods.ozolith = 0; s.mods.ozBank = 0; }); } }
          ]); return;
        }
        if (m.kind === "land" && on) {
          if (m.key === "oranrief") ask("Oran-Rief", [
            { label: "Tap: +1 on each green creature that entered this turn (" + s.ts.oranNew + ")", primary: 1, fn: function () { act(function () { var k = s.board.length - s.ts.oranNew; for (var i = Math.max(0, k); i < s.board.length; i++) give(s.board[i], 1); }); } },
            { label: "Oran-Rief leaves", fn: function () { act(function () { s.mods.oranrief = 0; }); } }]);
          else ask("Karn's Bastion", [
            { label: "4, T: proliferate once", primary: 1, fn: function () { proliferate(1); } },
            { label: "Bastion leaves", fn: function () { act(function () { s.mods.bastion = 0; }); } }]);
          return;
        }
        if (m.key === "spire" && on) {
          ask("Ozolith, the Shattered Spire", [
            { label: "1G, T: put a counter on a creature", primary: 1, fn: function () { askCreature("On which creature?", function (i) { act(function () { give(s.board[i], 1); }); }); } },
            { label: "Spire leaves", fn: function () { act(function () { s.mods.spire = 0; }); } }]);
          return;
        }
        act(function () { s.mods[m.key] = on ? 0 : 1; });
      });
      host.appendChild(c);
    });
    document.getElementById("anthVal").textContent = "+" + elfAnthem();
    var j = has("joraga"); document.getElementById("anthNote").textContent = (j ? "Joraga " + j.c + " " : "") + (count("archdruid") ? "Archdruid +" + count("archdruid") + " " : "") + (s.anthem ? "manual +" + s.anthem : "");
  }
  function renderMana() {
    var notes = [];
    s.board.forEach(function (b) {
      var C = CARDS[b.k]; if (!C.mana) return;
      var v = C.mana === "power" ? pow(b) : C.mana === "ctr" ? b.c : C.mana === "incub" ? (b.c > 0 ? 3 : 1) : C.mana === "elves" ? elves() : C.mana === "selvala" ? greatestPower() : 0;
      notes.push("<b>" + C.name.split(",")[0] + "</b> " + v);
    });
    document.getElementById("manaNote").innerHTML = notes.length ? "taps for: " + notes.join(" \xb7 ") : "";
  }
  function renderPick() {
    var sel = document.getElementById("enterPick"), cur = sel.value;
    sel.innerHTML = "";
    ORDER.forEach(function (k) {
      var C = CARDS[k], o = document.createElement("option"); o.value = k;
      var pe = entryPlan(k); o.textContent = C.name + "  (+" + pe.enter + ")";
      if (!C.generic && has(k) && k !== "elf" && k !== "other") o.textContent += " \u2014 on board";
      sel.appendChild(o);
    });
    sel.value = cur && CARDS[cur] ? cur : "elf";
  }
  function renderLog() {
    var host = document.getElementById("logbox"); host.innerHTML = "";
    s.log.slice().reverse().forEach(function (L) { var d = el("div"); d.textContent = "T" + L.t + ": " + L.cIn + " in, +" + L.ctr + " counters, +" + L.life + " life"; host.appendChild(d); });
  }
  function render() {
    document.getElementById("turnTop").textContent = "Turn " + s.turn;
    document.getElementById("turnNo").textContent = s.turn;
    document.getElementById("green").textContent = s.green;
    document.getElementById("colorless").textContent = s.colorless;
    document.getElementById("fx-cIn").textContent = s.ts.cIn;
    document.getElementById("fx-ctr").textContent = "+" + s.ts.ctr;
    document.getElementById("fx-life").textContent = "+" + s.ts.life;
    document.getElementById("undo").disabled = !hist.length;
    document.getElementById("prolif").textContent = has("tromell") ? "Proliferate \xd7" + s.ts.ntIn + " (Tromell)" : "Proliferate \xd71";
    renderIndic(); renderBoard(); renderMods(); renderMana(); renderPick(); renderLog();
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".mb"), function (x) {
    x.addEventListener("click", function () { var k = x.getAttribute("data-mana"), d = parseInt(x.getAttribute("data-d"), 10); act(function () { s[k] = Math.max(0, s[k] + d); }); });
  });
  document.getElementById("enterBtn").addEventListener("click", function () { enter(document.getElementById("enterPick").value, 0); });
  document.getElementById("enterX").addEventListener("click", function () { askNumber("X counters it enters with (before modifiers)", function (v) { enter(document.getElementById("enterPick").value, v); }); });
  document.getElementById("prolif").addEventListener("click", function () {
    var x = has("tromell") ? s.ts.ntIn : 1;
    if (has("tromell") && x === 0) { alert("Tromell's X is 0: no nontoken creature entered this turn."); return; }
    proliferate(x);
  });
  document.getElementById("actKalonian").addEventListener("click", function () { if (!has("kalonian")) { alert("Kalonian Hydra is not on the battlefield."); return; } act(function () { eachWithCounters(function (b) { give(b, b.c); }); }); });
  document.getElementById("actOuro").addEventListener("click", function () { var o = has("ouro"); if (!o) { alert("Ouroboroid is not on the battlefield."); return; } var x = pow(o); act(function () { s.board.forEach(function (b) { give(b, x); }); }); });
  document.getElementById("actSeymour").addEventListener("click", function () { var m = has("seymour"); if (!m) { alert("Maester Seymour is not on the battlefield."); return; } var x = pow(m); askCreature("Seymour puts " + place(x) + " on which creature?", function (i) { act(function () { give(s.board[i], x); }); }); });
  document.getElementById("actLand").addEventListener("click", function () {
    var opts = [];
    if (has("bill")) opts.push({ label: "Bristly Bill: +" + place(1) + " on a creature", primary: 1, fn: function () { askCreature("Bill's landfall counter on which creature?", function (i) { act(function () { give(s.board[i], 1); }); }); } });
    if (has("evosage")) opts.push({ label: "Evolution Sage: proliferate", fn: function () { proliferate(1); } });
    if (!opts.length) { alert("No landfall triggers on the battlefield (Bristly Bill, Evolution Sage)."); return; }
    ask("Land drop", opts);
  });
  document.getElementById("actBill").addEventListener("click", function () { if (!has("bill")) { alert("Bristly Bill is not on the battlefield."); return; } act(function () { eachWithCounters(function (b) { give(b, b.c); }); }); });
  document.getElementById("actAll").addEventListener("click", function () { askNumber("Put how many counters on EACH creature (before modifiers)?", function (v) { act(function () { s.board.forEach(function (b) { give(b, v); }); }); }); });
  document.getElementById("actOne").addEventListener("click", function () { askNumber("Put how many counters (before modifiers)?", function (v) { askCreature("On which creature?", function (i) { act(function () { give(s.board[i], v); }); }); }); });
  document.getElementById("actUntap").addEventListener("click", function () { act(function () { s.board.forEach(function (b) { b.t = 0; }); }); });
  document.getElementById("anthUp").addEventListener("click", function () { act(function () { s.anthem++; }); });
  document.getElementById("anthDn").addEventListener("click", function () { act(function () { if (s.anthem > 0) s.anthem--; }); });
  document.getElementById("undo").addEventListener("click", undo);
  document.getElementById("newturn").addEventListener("click", function () {
    act(function () {
      s.log.unshift({ t: s.turn, cIn: s.ts.cIn, ctr: s.ts.ctr, life: s.ts.life }); if (s.log.length > 60) s.log.pop();
      s.turn++; s.green = 0; s.colorless = 0;
      s.board.forEach(function (b) { b.t = 0; b.s = 0; });
      var w = has("warden"); if (w) give(w, 1);                       // Warden: +1 at your end step
      s.ts = { cIn: 0, ctr: 0, life: 0, ntIn: 0, weave: 0, galaMode: 0, oranNew: 0 };
    });
  });
  function newGame() {
    ask("New game", [
      { label: "Tromell \u2014 fresh board", primary: 1, fn: function () { act(function () { s = clone(DEFAULT); }); } },
      { label: "Tromell \u2014 start with Tromell on the battlefield", fn: function () { act(function () { s = clone(DEFAULT); s.board.push({ k: "tromell", c: 0, t: 0, s: 1 }); }); } },
      { label: "Switch to the Eladamri tracker", fn: function () { location.href = "index.html"; } }
    ]);
  }
  document.getElementById("newgame").addEventListener("click", newGame);
  document.getElementById("modeBtn").addEventListener("click", function () { ask("Deck", [{ label: "Eladamri elfball", fn: function () { location.href = "index.html"; } }, { label: "Tromell counters (this page)", primary: 1, fn: function () {} }]); });

  render();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js")["catch"](function () {});
  });
}
</script>
