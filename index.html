<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1410">
<meta name="apple-mobile-web-app-title" content="Elfball">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Elfball Board Tracker</title>
<style>
  :root {
    --ink: #0C1410; --panel: #14201A; --panel-2: #1B2A22; --well: #0E1712;
    --edge: #27392E; --edge-soft: #1F2F26; --bone: #E6E8DF; --dim: #7E8C81;
    --moss: #7FA86B; --moss-lit: #9BC684; --amber: #E8A33D; --shadow: rgba(0,0,0,.45);
    /* Three sizes on the page, no more: primary numbers, labels/buttons, meta.
       Everything else derives from these so the page cannot drift again. */
    --fs-lg: 25px;   /* every primary number, and the turn in the top bar */
    --fs-md: 13px;   /* every label, every button */
    --fs-sm: 9.5px;  /* meta only: sick counts, sub-notes, log */
    --num: 25px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #ECEFE7; --panel: #FFFFFF; --panel-2: #F2F5EC; --well: #E7EBE0;
      --edge: #CFD6C7; --edge-soft: #E1E6DA; --bone: #16231C; --dim: #5D6B60;
      --moss: #3D7838; --moss-lit: #2E6129; --amber: #9A5F10; --shadow: rgba(20,32,26,.10);
    }
  }
  :root[data-theme="dark"] {
    --ink: #0C1410; --panel: #14201A; --panel-2: #1B2A22; --well: #0E1712;
    --edge: #27392E; --edge-soft: #1F2F26; --bone: #E6E8DF; --dim: #7E8C81;
    --moss: #7FA86B; --moss-lit: #9BC684; --amber: #E8A33D; --shadow: rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --ink: #ECEFE7; --panel: #FFFFFF; --panel-2: #F2F5EC; --well: #E7EBE0;
    --edge: #CFD6C7; --edge-soft: #E1E6DA; --bone: #16231C; --dim: #5D6B60;
    --moss: #3D7838; --moss-lit: #2E6129; --amber: #9A5F10; --shadow: rgba(20,32,26,.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    margin: 0; background: var(--ink); color: var(--bone);
    font-family: var(--sans); font-size: var(--fs-md); line-height: 1.25;
    -webkit-text-size-adjust: 100%; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
  }
  /* Flex to the device: an iPad in landscape gets the full width, which also
     buys back rows of height on the wrapping grids. */
  html, body { height: 100%; }
  /* Fills the window, both directions. One column; the panels adapt to their
     OWN width via the container queries below. */
  .wrap {
    width: 100%; max-width: 820px; margin: 0 auto; padding: 6px 10px 8px;
    min-height: 100dvh; display: flex; flex-direction: column; gap: 5px;
  }
  .wrap > .grow { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-evenly; }
  .wrap > .grow > * { flex: 0 0 auto; }
  .panel { margin-bottom: 0; }




  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  h1 {
    font-size: var(--fs-lg); font-weight: 600; margin: 0; letter-spacing: .02em;
    color: var(--bone); font-family: var(--mono); white-space: nowrap;
  }
  h1 b { color: var(--amber); }
  .hbtns { display: flex; gap: 6px; }
  .hbtns button { padding: 8px 11px; font-size: var(--fs-md); min-height: 38px; }

  button {
    font-family: var(--sans); font-size: var(--fs-md); color: var(--bone);
    background: var(--panel-2); border: 1px solid var(--edge);
    border-radius: 9px; cursor: pointer; padding: 8px 12px;
    transition: background .1s ease, transform .06s ease;
  }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
  .primary { border-color: var(--moss); color: var(--moss-lit); font-weight: 600; }

  /* ---------- top: mana stacked left, counts stacked right ---------- */
  .top { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 0; align-content: start; }
  .tile {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 11px;
    padding: 3px 5px; box-shadow: 0 1px 2px var(--shadow);
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px;
  }
  .tile .label { font-size: var(--fs-md); letter-spacing: .04em; text-transform: uppercase; color: var(--bone);
    white-space: nowrap; flex: 0 0 126px; min-width: 0; overflow: hidden; text-align: left; }

  .val {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    line-height: 1; letter-spacing: -.02em;
  }
  .tile.derived .val { color: var(--amber); font-size: var(--fs-lg); }
  .tile.g .val { color: var(--moss-lit); }
  .tile.c .val { color: var(--bone); }

  /* the 2:1 column split leaves room for the buttons to flank the number
     at every width, phones included */
  .mrow { display: flex; flex-wrap: nowrap; justify-content: flex-start; align-items: center; gap: 5px; width: 100%; max-width: 466px; }
    /* the count never exceeds 99, so it needs little room; the buttons take the rest */
  .mrow .val { order: 2; flex: 0 0 auto; width: 40px; text-align: center; font-size: var(--fs-lg); }
  .mrow .m5 { order: 0; } .mrow .m1 { order: 1; }
  .mrow .p1 { order: 3; } .mrow .p5 { order: 4; }
  .mrow .mb {
    flex: 1 1 0; min-width: 0; max-width: 108px; height: 46px; padding: 0;
    font-family: var(--mono); font-size: var(--fs-md); color: var(--dim); border-radius: 7px;
  }
  .mrow .mb:hover { color: var(--bone); border-color: var(--moss); }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 11px;
    padding: 4px 7px 5px; margin-bottom: 4px; box-shadow: 0 1px 2px var(--shadow);
  }
  .panel h2 {
    font-size: var(--fs-md); letter-spacing: .07em; text-transform: uppercase; color: var(--moss-lit);
    margin: 0 0 2px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    min-height: 16px;
  }
  .panel h2 .tot { font-family: var(--mono); color: var(--bone); letter-spacing: 0; }

  /* ---------- counter rows ---------- */
  #rows { display: grid; grid-template-columns: 1fr; }
  /* A grid, not a flex row: the two creature rows then share column tracks, so
     every control sits at the same x on both and can be found by muscle memory. */
  /* The controls hug their number with one consistent margin; every scrap of
     slack goes to the right, where the running total sits centred in it. Fixed
     widths in the cluster keep the two rows in step with each other. */
  .crow { display: flex; align-items: center; padding: 3px 0; max-width: 600px; margin-left: auto; margin-right: auto; width: 100%; }
  .cgrp { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
  .crow + .crow { border-top: 1px solid var(--edge); margin-top: 4px; padding-top: 6px; }
  .crow > button, .cgrp > button {
    width: 48px; height: 48px; flex: 0 0 auto; padding: 0;
    font-family: var(--mono); font-size: var(--fs-lg); line-height: 1; color: var(--dim);
  }
  .crow > button:hover, .cgrp > button:hover { color: var(--bone); border-color: var(--moss); }
  .cmid { flex: 0 0 88px; width: 88px; text-align: center; }
  /* running total for the row, including tokens */
  /* The cell takes the slack so the value sits centred in it, but only the
     inner box is painted - stretching the box across the row looked absurd. */
  .rtot {
    display: flex; align-items: center; justify-content: flex-end;
    flex: 0 0 148px; margin-left: auto; overflow: hidden;
  }
  .rbox {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; padding: 2px 6px; border-radius: 8px;
    background: var(--well); border: 1px solid var(--edge-soft);
  }
  @media (max-width: 520px) {
    .cmid { flex-basis: 78px; width: 78px; }
    .rtot { flex-basis: 92px; }
    .rbox { padding: 2px 4px; }
    .cgrp { gap: 5px; }
  }
  .rtot .rtl { font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--dim);
    white-space: normal; line-height: 1.05; text-align: center; }
  .rtot .rtv {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1.05; color: var(--amber);
  }
  .cmid .nm { font-size: var(--fs-md); letter-spacing: .04em; text-transform: uppercase; color: var(--bone); font-weight: 600; }
  .cmid .n {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1.05;
  }
  .cmid .n.anth { color: var(--amber); }
  /* the section name lives in the row's own leading space, costing no height */

  .sick { font-family: var(--mono); font-size: var(--fs-sm); color: var(--dim); min-height: 11px; line-height: 1.15; }
  .sick.on { color: var(--amber); }

  /* ---------- token rows ---------- */
  /* Spare width is split four ways by the auto margins below, giving:
     margin | - card + | space | tap/untap | space | card | margin
     (a flex item's auto margins share out the free space equally). */
  #tokens { display: grid; grid-template-columns: 1fr; gap: 4px; }
  /* Three groups: the pile with its own +/- buttons, the tap controls, and the
     tapped pile. Space GROWS between the groups and never inside them, so the
     buttons stay welded to the card they change. */
  .trow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1px 0; width: 100%;
  }
  .tgrp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .trow > .tapbtns { margin: 0 clamp(8px, 2.4vw, 26px); }
  /* [- card +] hugs the untapped pile; [tap/untap][tapped card] hugs the
     tapped pile; the slack sits between the two groups, not inside them. */

  .trow + .trow { margin-top: 4px; border-top: 1px solid var(--edge-soft); padding-top: 4px; }
  /* Landscape earns a wider column and the two-up token layout; portrait keeps
     a single comfortable column and spends the extra width on side margins. */
  /* The tokens panel decides for itself: two-up only when ITS OWN box is wide
     enough, which is true in the single-column layout and false in a column. */
  @media (min-width: 900px) and (orientation: landscape) {
    #tokens { grid-template-columns: 1fr 1fr; column-gap: clamp(28px, 5vw, 72px); }
    .trow + .trow { margin-top: 0; border-top: none; padding-top: 0; border-left: 1px solid var(--edge-soft); padding-left: 16px; }
  }
  .trow > button {
    width: 42px; height: 46px; flex: 0 0 auto; padding: 0;
    font-family: var(--mono); font-size: var(--fs-lg); line-height: 1; color: var(--dim);
  }
  .trow > button:hover { color: var(--bone); border-color: var(--moss); }

  .card {
    flex: 0 0 auto; border-radius: 7px; padding: 3px;
    border: 1.5px solid var(--edge); background: var(--panel-2);
    display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 3px var(--shadow);
  }
  .card .bar { height: 6px; border-radius: 2px; background: var(--edge); flex: 0 0 auto; }
  .card .win {
    flex: 1; border-radius: 3px; background: var(--well); border: 1px solid var(--edge-soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card .cn {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1;
  }
  .card .cl { display: none; }
  /* Token art sits in the card's art window, behind the count. A radial
     scrim darkens the middle so the number stays legible without washing
     out the edges of the painting. */
  .card .win { background-size: cover; background-position: center; }
  .card.art-elf .win {
    background-image:
      radial-gradient(ellipse at center, rgba(6,14,9,.50) 0%, rgba(6,14,9,.24) 60%, rgba(6,14,9,.08) 100%),

  /* fixed light inks: the numbers now sit on artwork, not on the panel */
  .card .cn {
    color: #EFF6EA;
    text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,.95), 0 0 11px rgba(0,0,0,.75);
  }
  .card.up .cn { color: #BCE7A0; }
  .card .win .sick { color: #FFD27A; text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,.9); }
  .card.up { width: 50px; height: 70px; border-color: var(--moss); }
  .card.up .bar { background: color-mix(in srgb, var(--moss) 55%, transparent); }
  /* An empty pile fades its count and frame, but the type line stays at
     full strength so you can always tell which card the slot is for. */
  .card.zero .bar { opacity: .3; }
  .card.zero .cn { opacity: 0; }        /* empty: the art alone says "none" */
  .card.up.zero { border-color: var(--edge); }

  /* A tapped card is literally the untapped card rotated 90deg clockwise -
     identical markup and proportions, so the bar and type line ride around
     with it. The wrapper reserves the swapped footprint in the layout, and
     the number counter-rotates so it stays readable at a glance. */
  .tapwrap { position: relative; flex: 0 0 auto; width: 70px; height: 50px; }
  .card.tap {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 70px;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  .card.tap .cn { color: #D2DACE; transform: rotate(-90deg); }

  .tapbtns { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }

  .tapbtns button { width: 48px; height: 34px; padding: 0; font-size: var(--fs-lg); line-height: 1; color: var(--dim); }
  .tapbtns button:hover { color: var(--bone); border-color: var(--moss); }

  .hint { display: none; }

  /* ---------- wide: buttons flank the numbers, counters go side by side ---------- */
  /* Wide screens get roomier controls, not a second type scale. */
  @media (min-width: 560px) {
    :root { --fs-lg: 28px; --fs-md: 14px; --fs-sm: 10px; --num: 28px; }
    .mrow { gap: 6px; max-width: 450px; }
    .mrow .mb { height: 48px; }
    .mrow .val { width: 50px; }
    .tile .label { flex-basis: 142px; }
    .crow > button, .cgrp > button { width: 58px; height: 56px; }
    .cmid { flex-basis: 96px; width: 96px; }
    .card.up { width: 62px; height: 86px; }
    .tapwrap { width: 86px; height: 62px; }
    .card.tap { width: 62px; height: 86px; }
    .trow > button { width: 48px; height: 56px; }
    .tapbtns button { width: 54px; height: 40px; }
  }

  /* ---------- tracked permanents ---------- */
  /* flex-wrap with a small basis: one row on a tablet, two or three on a
     phone, without a media query fighting the card widths. */
  .perms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  @media (min-width: 360px) { .perms { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 700px) { .perms { grid-template-columns: repeat(5, 1fr); } }
  /* A wide, short chip can only ever show a thin band of a tall illustration,
     so extra height is the only real way to zoom the crop out. */
  .perm {
    min-width: 0; min-height: 90px;
    background: var(--panel-2); border: 1px solid var(--edge); border-radius: 8px;
    padding: 3px 3px 4px; display: flex; flex-direction: column; align-items: center; gap: 0;
    position: relative; overflow: hidden; justify-content: space-between;
  }
  /* Card art sits behind each chip as a landscape watermark. The name stays at
     full strength so an OFF permanent is still readable at a glance. */
  .perm::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-size: cover; background-position: center 28%; opacity: .78;
  }
  /* Off keeps its colour - it just sits back a little. The border and the
     greyed value are what say "not on the battlefield". */
  .perm.off::before { opacity: .42; }
  .perm::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(12,20,16,.58) 0%, rgba(12,20,16,.10) 42%, rgba(12,20,16,.66) 100%);
  }
  .perm .pn, .perm .pv, .perm .ps, .perm .pmid {
    text-shadow: 0 1px 2px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.6);
  }
  .perm .pmb { background: rgba(12,20,16,.42); backdrop-filter: blur(1px); }

  .perm.off { opacity: 1; }
  .perm.on { border-color: var(--moss); }
  .perm.off .pv, .perm.off .ps { color: var(--dim); }
  .perm .pn {
    font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--bone);
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    width: 100%; position: relative; z-index: 1;
  }
  .perm.on .pn { color: #EFF6EA; }
  .perm .pv {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--fs-lg); line-height: 1.05; color: var(--amber); position: relative; z-index: 1;
  }
  .perm.off .pv { color: var(--dim); }
  .perm .ps {
    font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--dim);
    min-height: 0; line-height: 1.1; position: relative; z-index: 1;
  }
  .perm .ps b { color: var(--moss-lit); font-weight: 600; }
  .perm .ps s { color: var(--edge); text-decoration: none; }
  /* The card IS the switch - tapping the body toggles it. The counter
     buttons flank the number and swallow the click so they never toggle. */
  .perm { cursor: pointer; }
  .perm:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .perm .pmid { display: flex; align-items: center; justify-content: center; gap: 2px; width: 100%; }
  .perm .pmb {
    flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border-radius: 6px;
    font-family: var(--mono); font-size: var(--fs-md); line-height: 1; color: var(--dim);
    background: transparent; border-color: var(--edge-soft);
  }
  .perm .pmb:hover { color: var(--bone); border-color: var(--moss); }
  .perm .pmid .pv { flex: 1 1 auto; text-align: center; }

  /* ---------- per-turn statistics ---------- */
  /* Two ways a creature arrives. Cast fires Lys Alana Huntmaster; put does not. */
  .addwrap { display: flex; gap: 7px; flex: 0 0 auto; }
  .addb {
    width: 48px; height: 48px; padding: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0; line-height: 1;
  }
  .addb .ab { font-family: var(--mono); font-size: var(--fs-lg); color: var(--dim); }
  .addb .al { font-size: var(--fs-sm); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .addb:hover { border-color: var(--moss); }
  .addb:hover .ab, .addb:hover .al { color: var(--bone); }

  /* One line, not a row of tiles: these are numbers you glance at, not press. */
  .turnline {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; font-size: var(--fs-md);
  }
  .turnline .tl-lab {
    color: var(--moss-lit); text-transform: uppercase; letter-spacing: .07em;
    font-weight: 600; white-space: nowrap;
  }
  .turnline .tl-it {
    color: var(--dim); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
  }
  .turnline b {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; padding-left: 6px;
  }
  .turnline .dn { padding-left: 8px; }
  .turnline .up { color: var(--moss-lit); }
  .turnline .dn { color: #D98A8A; }

  /* ---------- by-turn log ---------- */
  .logbox { max-height: 30px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .logline {
    font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.45; color: var(--dim);
    white-space: nowrap; overflow-x: auto;
  }
  .logline b { color: var(--bone); font-weight: 600; }
  .logline .up { color: var(--moss-lit); }
  .logline .dn { color: #D98A8A; }
  .logline.cur { color: var(--bone); }
  .logempty { font-size: var(--fs-sm); color: var(--dim); text-align: center; padding: 4px 0; }

  /* ---------- change feedback ---------- */
  /* Floaters live in a fixed overlay and are positioned from each target's
     bounding box, so no ancestor needs position:relative. */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .flt {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-weight: 700; font-size: calc(var(--fs-lg) * 1.35); line-height: 1;
    text-shadow: 0 2px 6px rgba(0,0,0,.6); white-space: nowrap;
    animation: fltfade 5s ease-out forwards;
  }
  .flt.pos { color: rgba(155, 198, 132, .92); }
  .flt.neg { color: rgba(226, 138, 138, .92); }
  .flt.zero { color: rgba(126, 140, 129, .8); }
  @keyframes fltfade {
    0%   { opacity: 0;   transform: translate(-50%, -30%) scale(.7); }
    6%   { opacity: .95; transform: translate(-50%, -60%) scale(1.12); }
    16%  { opacity: .92; transform: translate(-50%, -74%) scale(1); }
    70%  { opacity: .8;  transform: translate(-50%, -104%) scale(1); }
    100% { opacity: 0;   transform: translate(-50%, -150%) scale(.96); }
  }
  /* labelled one-off, e.g. "+1 treasure" from Gala Greeters */
  .flt.note { font-size: var(--fs-md); font-weight: 600; letter-spacing: .01em; }
  .flt.note.manual { color: rgba(232,163,61,.95); }
  .glowing { animation: glowpulse 1.5s ease-out; border-radius: 8px; }
  .glowing.neg { animation-name: glowpulseneg; }
  @keyframes glowpulse {
    0%   { box-shadow: 0 0 0 0 rgba(155,198,132,.0); }
    18%  { box-shadow: 0 0 13px 3px rgba(155,198,132,.55); }
    100% { box-shadow: 0 0 0 0 rgba(155,198,132,0); }
  }
  @keyframes glowpulseneg {
    0%   { box-shadow: 0 0 0 0 rgba(226,138,138,.0); }
    18%  { box-shadow: 0 0 13px 3px rgba(226,138,138,.55); }
    100% { box-shadow: 0 0 0 0 rgba(226,138,138,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .flt { animation: fltfadeplain 4.6s linear forwards; }
    @keyframes fltfadeplain { 0%,78% { opacity: .9; } 100% { opacity: 0; } }
    .glowing, .glowing.neg { animation: none; }
  }

  button[disabled] { opacity: .35; cursor: default; }
  button[disabled]:active { transform: none; }

  @media (min-width: 560px) {
    .perm { min-height: 100px; }
    .logbox { max-height: 32px; }
    .addb { width: 58px; height: 56px; }
  }
  /* Room to breathe at the edges once the window is wide - the minus buttons
     should not sit hard against the frame. */
  @media (min-width: 900px) {
    .panel { padding-left: 20px; padding-right: 20px; }
    .tile { padding-left: 16px; padding-right: 16px; }
    .wrap { padding-left: 16px; padding-right: 16px; }
  }

  /* ---------- token detail view ----------
     A full-screen layer inside the same file, not a second page: the tracker
     has to stay one self-contained document so it works offline and copies
     cleanly between devices. history.pushState wires it to the back gesture. */
  #detail {
    position: fixed; inset: 0; z-index: 40; background: var(--ink);
    overflow-y: auto; -webkit-overflow-scrolling: touch; display: none;
    padding: 6px 8px 24px;
  }
  #detail > * { max-width: 1000px; margin-left: auto; margin-right: auto; }
  body.detail-open #detail { display: block; }
  body.detail-open .wrap { display: none; }
  #detail header { position: sticky; top: 0; background: var(--ink); padding: 2px 0 6px; z-index: 2; }
  #detail .dsum { font-family: var(--mono); font-size: var(--fs-sm); color: var(--dim); }
  #detail .dsum b { color: var(--bone); }

  /* Roomy square cells: a card has to be able to rotate inside one, and the
     extra gap makes them tappable without magnifying. */
  .tokgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 11px; }
  .tokcell { position: relative; height: 104px; border-radius: 10px; }
  .tokcell:active { background: rgba(127,168,107,.07); }

  /* The face reuses .card / .art-elf so it carries the same artwork and inks
     as the board screen. Tapped is shown the way the board screen shows it -
     the card lies on its side - so there is nothing to read. */
  .tokgrid .card {
    position: absolute; top: 50%; left: 50%; width: 58px; height: 82px;
    transform: translate(-50%, -50%); transition: transform .16s ease;
  }
  .tokcell.tapped .card { transform: translate(-50%, -50%) rotate(90deg); border-color: var(--edge); }
  .tokgrid .card .win { border-radius: 3px; }
  .tokgrid .card .cn { font-size: var(--fs-md); transition: transform .16s ease; }
  .tokcell.tapped .card .cn { transform: rotate(-90deg); color: #D2DACE; }
  .tokcell.tapped .card .bar { opacity: .35; }
  @media (prefers-reduced-motion: reduce) {
    .tokgrid .card, .tokgrid .card .cn { transition: none; }
  }

  /* Summoning sickness: an amber pip on the cell, so it does not ride around
     when the card rotates. No label. */
  .tokcell.sick::after {
    content: ""; position: absolute; top: 6px; left: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px rgba(232,163,61,.85);
    z-index: 3; pointer-events: none;
  }
  .tokcell .tctr {
    position: absolute; left: 5px; bottom: 5px; z-index: 3; pointer-events: none;
    font-family: var(--mono); font-size: var(--fs-sm); line-height: 1; color: var(--amber);
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  /* Invisible hit zones sit over the cell and never rotate, so "top" always
     means add a counter no matter which way the card is lying. */
  .tzone {
    position: absolute; left: 0; right: 0; height: 30px; z-index: 2; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: var(--fs-md); line-height: 1; color: var(--dim);
    opacity: .55;
  }
  .tzone.tup { top: 0; }
  .tzone.tdn { bottom: 0; }
  .tzone:active { opacity: 1; color: var(--bone); }
  .tmidzone { position: absolute; left: 0; right: 0; top: 30px; bottom: 30px; z-index: 2; cursor: pointer; }
  .tkill {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; padding: 0;
    border-radius: 5px; font-size: 11px; line-height: 1; color: var(--dim);
    background: transparent; border-color: transparent; z-index: 4;
  }
  .tkill:hover { color: #E28A8A; border-color: var(--edge); }
  .dbulk { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .dbulk button { flex: 1 1 auto; font-size: var(--fs-md); padding: 8px 8px; }
  .dempty { color: var(--dim); font-size: var(--fs-sm); text-align: center; padding: 18px 0; }
  .panel h2 button { font-size: var(--fs-md); padding: 3px 22px; min-height: 26px; border-radius: 7px; letter-spacing: .06em; font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <header class="a-hdr">
    <h1 id="turnTop">Turn 1</h1>
    <div class="hbtns">
      <button id="sound">Sound</button>
      <button id="undo">Undo</button>
      <button class="primary" id="newturn">New turn</button>
      <button id="newgame">New game</button>
    </div>
  </header>

  <div class="top a-mana">
    <div class="tile g">
      <span class="label">Green mana</span>
      <div class="mrow">
        <button type="button" class="mb m5" data-mana="green" data-d="-5" aria-label="Remove five green">&minus;5</button>
        <button type="button" class="mb m1" data-mana="green" data-d="-1" aria-label="Remove one green">&minus;1</button>
        <span class="val" id="green">0</span>
        <button type="button" class="mb p1" data-mana="green" data-d="1" aria-label="Add one green">+1</button>
        <button type="button" class="mb p5" data-mana="green" data-d="5" aria-label="Add five green">+5</button>
      </div>
    </div>

    <div class="tile c">
      <span class="label">Colorless mana</span>
      <div class="mrow">
        <button type="button" class="mb m5" data-mana="colorless" data-d="-5" aria-label="Remove five colorless">&minus;5</button>
        <button type="button" class="mb m1" data-mana="colorless" data-d="-1" aria-label="Remove one colorless">&minus;1</button>
        <span class="val" id="colorless">0</span>
        <button type="button" class="mb p1" data-mana="colorless" data-d="1" aria-label="Add one colorless">+1</button>
        <button type="button" class="mb p5" data-mana="colorless" data-d="5" aria-label="Add five colorless">+5</button>
      </div>
    </div>
  </div>

  <div class="panel grow a-cre">
    <div id="rows"></div>
  </div>

  <div class="panel grow a-tok">
    <h2><span>Tokens</span><button type="button" id="detailBtn">Detail</button></h2>
    <div id="tokens"></div>
  </div>

  <div class="panel grow a-perm">
    <h2><span>Tracked permanents</span></h2>
    <div class="perms" id="perms"></div>
  </div>

  <div class="panel turnline a-turn">
    <span class="tl-lab">This turn (<span id="turnNo">1</span>):</span>
    <span class="tl-it">Creatures <b class="up" id="fx-cIn">+0</b><b class="dn" id="fx-cOut">-0</b></span>
    <span class="tl-it">Elves <b class="up" id="fx-eIn">+0</b><b class="dn" id="fx-eOut">-0</b></span>
    <span class="tl-it">Life gain <b class="up" id="fx-life">+0</b></span>
  </div>

  <div class="panel a-log">
    <h2><span>By turn</span></h2>
    <div class="logbox" id="logbox"></div>
  </div>

  <p class="hint">New turn: untap all, clear sickness, empty mana, bank the turn in the log.
     Anthems and tracked permanents stay. Undo steps back through everything.</p>
</div>

<div id="detail">
  <header>
    <div class="hbtns" style="justify-content:space-between">
      <button class="primary" id="backBtn">&lt; Board</button>
      <span class="dsum" id="dsum"></span>
      <button id="undo2">Undo</button>
    </div>
  </header>
  <div class="dbulk" id="dbulk"></div>
  <div class="tokgrid" id="tokgrid"></div>
</div>

<div id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  // Escaped, not literal: keeps this file pure ASCII so it renders correctly
  // even when a host serves it without a UTF-8 charset header.
  var MINUS = "\u2212";   // minus sign
  var TAP   = "\u21bb";   // clockwise open circle arrow
  var UNTAP = "\u21ba";   // counterclockwise - the mirror of TAP
  var DASH  = "\u2013";   // en dash, used for "this permanent is off"
  var CROSS = "\u00d7";   // multiplication sign, used as a kill button

  var STORE = "elfball_v6";
  var OLD = "elfball_v5";
  var FADE = 5000;   // how long a floater lives
  var STEP = 500;    // cascade delay per tier

  var DEFAULT = {
    green: 0, colorless: 0,
    elves: 0, elvesSick: 0,
    others: 0, othersSick: 0,
    anthems: 0,
    // Elf Warriors are tracked one at a time: once Arwen, Bramblewood, Dionus
    // or a proliferate lands, the pile stops being homogeneous and a count
    // can no longer describe it. {t:tapped, k:summoning sick, c:counters}
    elfToks: [],
    treTok: { up: 0, tapped: 0, sick: 0 },
    turn: 1,
    ts: { cIn: 0, cOut: 0, eIn: 0, eOut: 0, life: 0, ntIn: 0 },
    log: [],
    marwyn:     { on: 0, ctr: 0 },
    gala:       { on: 0, ctr: 0, mTre: 0, mLife: 0, mCtr: 0 },
    arwen:      { on: 0, ctr: 0 },
    bramble:    { on: 0 },
    tromell:    { on: 0 },
    warden:     { on: 0 },
    emissary:   { on: 0 },
    warmaster:  { on: 0, fired: 0 },
    huntmaster: { on: 0 },
    contrib: { wm: 0, hm: 0, wd: 0, em: 0, bp: 0, ar: 0 }
  };

  function n(v) { return Math.max(0, parseInt(v, 10) || 0); }
  function b(v) { return v ? 1 : 0; }
  function tokOf(p) { return { up: n(p && p.up), tapped: n(p && p.tapped), sick: n(p && p.sick) }; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // s is REASSIGNED by undo, so nothing may capture s.elfToks (or any other
  // sub-object) in a closure. Everything reaches state through s.<key> at
  // call time; controls take a key or an index, never the object.
  var s = load();
  var hist = [];
  var HIST_MAX = 60;

  function load() {
    var d = clone(DEFAULT), p = null, i;
    try { p = JSON.parse(localStorage.getItem(STORE) || localStorage.getItem(OLD) || "null"); }
    catch (e) { p = null; }
    if (!p) return d;
    d.green = n(p.green); d.colorless = n(p.colorless);
    d.elves = n(p.elves); d.elvesSick = n(p.elvesSick);
    d.others = n(p.others); d.othersSick = n(p.othersSick);
    d.anthems = n(p.anthems);
    d.treTok = tokOf(p.treTok);
    d.turn = Math.max(1, n(p.turn) || 1);

    if (Object.prototype.toString.call(p.elfToks) === "[object Array]") {
      for (i = 0; i < p.elfToks.length && i < 400; i++) {
        var T = p.elfToks[i] || {};
        d.elfToks.push({ t: b(T.t), k: b(T.k), c: n(T.c) });
      }
    } else if (p.elfTok) {
      // migrate the old up/tapped/sick counts into individual tokens
      var o = tokOf(p.elfTok), made = 0;
      for (i = 0; i < o.up; i++) d.elfToks.push({ t: 0, k: made++ < o.sick ? 1 : 0, c: 0 });
      for (i = 0; i < o.tapped; i++) d.elfToks.push({ t: 1, k: made++ < o.sick ? 1 : 0, c: 0 });
    }

    if (p.ts) d.ts = { cIn: n(p.ts.cIn), cOut: n(p.ts.cOut), eIn: n(p.ts.eIn), eOut: n(p.ts.eOut), life: n(p.ts.life), ntIn: n(p.ts.ntIn) };
    if (Object.prototype.toString.call(p.log) === "[object Array]") {
      for (i = 0; i < p.log.length && i < 60; i++) {
        var L = p.log[i] || {};
        d.log.push({ t: n(L.t), cIn: n(L.cIn), cOut: n(L.cOut), eIn: n(L.eIn), eOut: n(L.eOut), life: n(L.life) });
      }
    }
    ["marwyn", "gala", "arwen"].forEach(function (k) {
      if (p[k]) { d[k].on = b(p[k].on); d[k].ctr = n(p[k].ctr); }
    });
    if (p.gala) { d.gala.mTre = b(p.gala.mTre); d.gala.mLife = b(p.gala.mLife); d.gala.mCtr = b(p.gala.mCtr); }
    ["bramble", "tromell", "warden", "emissary", "huntmaster"].forEach(function (k) {
      if (p[k]) d[k].on = b(p[k].on);
    });
    if (p.warmaster) { d.warmaster.on = b(p.warmaster.on); d.warmaster.fired = b(p.warmaster.fired); }
    if (p.contrib) {
      d.contrib = { wm: n(p.contrib.wm), hm: n(p.contrib.hm), wd: n(p.contrib.wd),
                    em: n(p.contrib.em), bp: n(p.contrib.bp), ar: n(p.contrib.ar) };
    }
    return d;
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) { /* session only */ } }

  /* ---------- derived ---------- */
  function elfUpCount() { var c = 0, i; for (i = 0; i < s.elfToks.length; i++) if (!s.elfToks[i].t) c++; return c; }
  function elfTapCount() { return s.elfToks.length - elfUpCount(); }
  function elfSickCount() { var c = 0, i; for (i = 0; i < s.elfToks.length; i++) if (s.elfToks[i].k) c++; return c; }
  function allElves() { return s.elves + s.elfToks.length; }
  function allCreatures() { return allElves() + s.others; }
  function marwynPower() { return s.marwyn.on ? 1 + s.marwyn.ctr + s.anthems : 0; }
  // Arwen is a 2/1; her toughness is what every other creature enters with.
  // She is an Elf, so every anthem pumps her too.
  function arwenToughness() { return s.arwen.on ? 1 + s.arwen.ctr + s.anthems : 0; }
  function tokenPT(t) { return 1 + t.c + s.anthems; }
  // Counters a creature entering now would pick up. Tromell is deliberately
  // absent: it reads "each other NONTOKEN creature", so it never sees a token.
  function entryCounters(isWarrior) {
    return arwenToughness() + (s.bramble.on && isWarrior ? 1 : 0);
  }

  function btn(txt, aria, fn, cls) {
    var x = document.createElement("button");
    x.type = "button"; x.textContent = txt; x.setAttribute("aria-label", aria);
    if (cls) x.className = cls;
    x.addEventListener("click", fn);
    return x;
  }

  var actx = null, sfxBuf = {}, sfxMuted = false, sfxQ = [];
  try { sfxMuted = localStorage.getItem("elfball_mute") === "1"; } catch (e) {}

  (function initAudio() {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { actx = new C(); } catch (e) { return; }
    for (var k in SFX_URI) {
      if (!SFX_URI.hasOwnProperty(k)) continue;
      (function (name, uri) {
        var raw = atob(uri.split(",")[1]), n = raw.length, arr = new Uint8Array(n), i;
        for (i = 0; i < n; i++) arr[i] = raw.charCodeAt(i);
        actx.decodeAudioData(arr.buffer,

          function () { /* unsupported codec: stay silent rather than throw */ });
      })(k, SFX_URI[k]);
    }
  })();

  function sfx(name, vol, delayMs) {
    if (sfxMuted || !actx || !sfxBuf[name]) return;
    if (actx.state === "suspended" && actx.resume) actx.resume();
    try {
      var src = actx.createBufferSource(); src.buffer = sfxBuf[name];
      // slight detune so a run of the same sound does not machine-gun
      src.playbackRate.value = 1 + (Math.random() * 0.07 - 0.035);
      var g = actx.createGain(); g.gain.value = (vol == null ? 0.85 : vol);
      src.connect(g); g.connect(actx.destination);
      src.start(actx.currentTime + (delayMs || 0) / 1000);
    } catch (e) { /* never let audio break the tracker */ }
  }
  function sfxAt(name, tier, vol) { sfxQ.push({ n: name, t: tier || 0, v: vol }); }
  function flushSfx() {
    var seen = {};
    sfxQ.forEach(function (q) {
      seen[q.n] = (seen[q.n] || 0) + 1;
      if (seen[q.n] > 3) return;        // twenty tokens = a flurry, not twenty shots
      sfx(q.n, q.v, q.t * STEP + (seen[q.n] - 1) * 70);
    });
    sfxQ = [];
  }

    if (stage) while (stage.firstChild) stage.removeChild(stage.firstChild);

  function dropFloat(key) {
    var f = floats[key];
    if (!f) return;
    clearTimeout(f.timer);
    if (f.node && f.node.parentNode) f.node.parentNode.removeChild(f.node);
    var host = document.getElementById(FLOAT_EL[key]);

  function bump(key, delta) {
    var host = document.getElementById(FLOAT_EL[key]);

    var f = floats[key];
    if (!f) {

      stage.appendChild(f.node);

    f.total += delta;
    clearTimeout(f.timer);

    var host = document.getElementById(FLOAT_EL[key]);
    var stage = document.getElementById("fx");
    if (!host || !stage || document.body.classList.contains("detail-open")) return;
    var node = el("div", "flt note pos" + (/mana/.test(text) ? " manual" : ""));
    node.textContent = text;
    stage.appendChild(node);
    place(node, host, -(26 + idx * 17));
    setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, FADE);
  }

  function showDeltas(before, after, primary) {
    var k, d;
    for (k in after) {
      if (!after.hasOwnProperty(k)) continue;
      d = after[k] - before[k];
      if (d === 0) continue;
      var tier = (k === primary) ? 0 : (TIER_LAST[k] ? 2 : 1);
      (function (kk, dd) { setTimeout(function () { bump(kk, dd); }, tier * STEP); })(k, d);
    }
    notes.forEach(function (nt, i) { setTimeout(function () { showNote(nt.key, nt.text, i); }, STEP); });
  }

  /* ---------- the one place state changes ---------- */
  function act(fn, opts) {
    opts = opts || {};
    hist.push(JSON.stringify(s));
    if (hist.length > HIST_MAX) hist.shift();
    if (opts.reset) dropFloat(opts.reset);
    // NB: do NOT clear sfxQ here. Handlers queue their sound BEFORE calling
    // act(), so resetting the queue on entry silently threw those away -
    // flushSfx() empties it at the end, which is the only reset needed.
    notes = [];
    var before = probe();
    fn();
    var after = probe();
    // one phrase for the whole turn's gain, not one per creature entering
    if (after.life > before.life) sfxAt("life", 2, 0.75);
    if (opts.silent) clearFloats(); else showDeltas(before, after, opts.primary);
    flushSfx();
    render();
  }
  function undo() {
    if (!hist.length) return;
    sfxQ = [];              // discard anything queued but not yet flushed
    sfx("undo");
    clearFloats();
    s = JSON.parse(hist.pop());
    render();
  }

  /* ---------- ETB trigger cascade ---------- */
  function onEnter(isElf, wasCast, depth, isToken) {
    s.ts.cIn++;
    if (isElf) s.ts.eIn++;
    if (!isToken) s.ts.ntIn++;         // Tromell proliferates X = nontoken entries this turn

    if (s.marwyn.on && isElf) { s.marwyn.ctr++; sfxAt("counterUp", 1, 0.55); }

    if (s.gala.on) {
      if (!s.gala.mTre) { s.gala.mTre = 1; s.treTok.tapped++; sfxAt("galaTre", 1); notes.push({ key: "gala", text: "+1 treasure" }); }
      else if (!s.gala.mLife) { s.gala.mLife = 1; s.ts.life += 2; notes.push({ key: "gala", text: "+2 life" }); }
      else if (!s.gala.mCtr) { s.gala.mCtr = 1; s.gala.ctr++; notes.push({ key: "gala", text: "+1 counter" }); }
    }

    if (s.warden.on) { s.ts.life++; s.contrib.wd++; }
    if (s.emissary.on) { s.ts.life++; s.contrib.em++; }

    if (isElf && depth < 8) {
      if (s.warmaster.on && !s.warmaster.fired) { s.warmaster.fired = 1; s.contrib.wm++; elfTokenEnters(depth + 1); }
      if (s.huntmaster.on && wasCast) { s.contrib.hm++; elfTokenEnters(depth + 1); }
    }
  }
  function elfTokenEnters(depth) {
    sfxAt("tokDeploy", depth > 0 ? 1 : 0);   // direct press instant, cascade waits a beat
    var c = entryCounters(true);        // Elf Warrior tokens are Warriors
    if (s.arwen.on && arwenToughness() > 0) s.contrib.ar += arwenToughness();
    if (s.bramble.on) s.contrib.bp++;
    s.elfToks.push({ t: 0, k: 1, c: c });
    onEnter(true, false, depth, true);
  }

  /* ---------- non-token creature rows ---------- */
  var ROWS = [
    { key: "elves", sickKey: "elvesSick", label: "Elves", fx: "fx-nElves", pk: "nElves", elf: true,
      totLabel: "All elves", totId: "tElves" },
    { key: "others", sickKey: "othersSick", label: "Others", fx: "fx-nOthers", pk: "nOthers", elf: false,
      totLabel: "All creatures", totId: "tCreatures" }
  ];
  function addBtn(label, aria, fn) {

  /* ---------- token rows on the board screen ---------- */
  function buildElfRow() {
    var row = el("div", "trow");
    var grp = el("div", "tgrp");
    grp.appendChild(btn(MINUS, "Remove one Elf Warrior token", function () {
      if (s.elfToks.length) sfxAt("tokDie", 0);
      act(function () {
        var i = lastIndexWhere(function (t) { return t.t; });
        if (i < 0) i = s.elfToks.length - 1;
        if (i < 0) return;
        s.elfToks.splice(i, 1);
        s.ts.cOut++; s.ts.eOut++;
      }, { primary: "elfUp" });
    }));
    var up = el("div", "card up art-elf");
    up.innerHTML = '<div class="bar"></div><div class="win" id="fx-elfTok-up">' +
      '<span class="cn" data-elfup="1">0</span><span class="sick" data-elfsick="1"></span></div>' +
      '<div class="cl">Elf Warrior</div>';
    grp.appendChild(up);
    grp.appendChild(btn("+", "Add one Elf Warrior token", function () {
      act(function () { elfTokenEnters(0); }, { primary: "elfUp" });
    }));
    row.appendChild(grp);
    var mid = el("div", "tapbtns");
    mid.appendChild(btn(TAP, "Tap one Elf Warrior token", function () {
      act(function () { var i = firstIndexWhere(function (t) { return !t.t; }); if (i >= 0) { s.elfToks[i].t = 1; sfxAt("tokTap", 0); } });
    }));
    mid.appendChild(btn(UNTAP, "Untap one Elf Warrior token", function () {
      act(function () { var i = firstIndexWhere(function (t) { return t.t; }); if (i >= 0) { s.elfToks[i].t = 0; sfxAt("tokUntap", 0); } });
    }));
    row.appendChild(mid);
    var tw = el("div", "tapwrap");
    var tp = el("div", "card tap art-elf");
    tp.innerHTML = '<div class="bar"></div><div class="win" id="fx-elfTok-tap">' +
      '<span class="cn" data-elftap="1">0</span></div><div class="cl">Elf Warrior</div>';
    tw.appendChild(tp);
    row.appendChild(tw);
    document.getElementById("tokens").appendChild(row);
    return { up: up, tp: tp };
  }
  function firstIndexWhere(f) { for (var i = 0; i < s.elfToks.length; i++) if (f(s.elfToks[i])) return i; return -1; }
  function lastIndexWhere(f) { for (var i = s.elfToks.length - 1; i >= 0; i--) if (f(s.elfToks[i])) return i; return -1; }

  function buildToken(key, label, hasSick, artCls, fxUp, fxTap, isCreature, consumable) {
    var row = el("div", "trow");
    var grp = el("div", "tgrp");
    var upKey = "treUp";
    grp.appendChild(btn(MINUS, consumable ? "Spend one " + label : "Remove one " + label, function () {
      sfxAt("coin", 0);
      act(function () {
        var t = s[key];
        if (consumable) {
          if (t.up > 0) { t.up--; notes.push({ key: upKey, text: "+1 mana" }); }
          else if (t.tapped > 0) t.tapped--;
          else return;
        } else {
          if (t.tapped > 0) t.tapped--; else if (t.up > 0) t.up--; else return;
        }
        if (t.sick > t.up + t.tapped) t.sick = t.up + t.tapped;
      }, { primary: upKey });
    }));
    var up = el("div", "card up " + artCls);
    up.innerHTML = '<div class="bar"></div><div class="win" id="' + fxUp + '">' +
      '<span class="cn" data-up="' + key + '">0</span></div><div class="cl">' + label + '</div>';
    grp.appendChild(up);
    grp.appendChild(btn("+", "Add one " + label, function () {
      sfxAt("coin", 0);
      act(function () { s[key].up++; }, { primary: upKey });
    }));
    row.appendChild(grp);
    var mid = el("div", "tapbtns");
    mid.appendChild(btn(TAP, "Tap one " + label, function () {
      act(function () { var t = s[key]; if (t.up > 0) { t.up--; t.tapped++; sfxAt("coin", 0); } });
    }));
    mid.appendChild(btn(UNTAP, "Untap one " + label, function () {
      act(function () { var t = s[key]; if (t.tapped > 0) { t.tapped--; t.up++; sfxAt("coin", 0); } });
    }));
    row.appendChild(mid);
    var tw = el("div", "tapwrap");
    var tp = el("div", "card tap " + artCls);
    tp.innerHTML = '<div class="bar"></div><div class="win" id="' + fxTap + '">' +
      '<span class="cn" data-tapped="' + key + '">0</span></div><div class="cl">' + label + '</div>';
    tw.appendChild(tp);
    row.appendChild(tw);
    document.getElementById("tokens").appendChild(row);
    return { up: up, tp: tp, key: key };
  }

  /* ---------- tracked permanents ---------- */
  // Grouped the way Anthony reads the board: ramp, then counter-adders,
  // then token creators, then lifegain.
  var PERMS = [
    { key: "marwyn", name: "Marwyn", fx: "fx-marwyn", ctr: true,
      note: "taps for X", val: function () { return marwynPower(); } },
    { key: "gala", name: "Gala Greeters", fx: "fx-gala", ctr: true,
      note: "counters", val: function () { return s.gala.ctr; } },
    { key: "tromell", name: "Tromell", fx: "fx-tr", prolif: true,
      note: "proliferate X", val: function () { return s.ts.ntIn; } },
    { key: "arwen", name: "Arwen", fx: "fx-arwen", ctr: true,
      note: "toughness", val: function () { return arwenToughness(); } },
    { key: "bramble", name: "Bramblewood", fx: "fx-bp",
      note: "ctrs given", val: function () { return s.contrib.bp; } },
    { key: "huntmaster", name: "Huntmaster", fx: "fx-hm",
      note: "tokens on cast", val: function () { return s.contrib.hm; } },
    { key: "warmaster", name: "Warmaster", fx: "fx-wm",
      note: "tokens, 1/turn", val: function () { return s.contrib.wm; } },
    { key: "warden", name: "Essence Warden", fx: "fx-wd",
      note: "life this turn", val: function () { return s.contrib.wd; } },
    { key: "emissary", name: "Virulent Emiss.", fx: "fx-em",
      note: "life this turn", val: function () { return s.contrib.em; } },
    { key: "anthems", name: "Other anthems", fx: "fx-anthems", ctr: true, always: true,
      note: "to army", val: function () { return s.anthems; } }
  ];

  function floatKeyFor(k) {
    return { marwyn: "marwyn", arwen: "arwen", gala: "gala", bramble: "bp", tromell: "tr",
             warmaster: "wm", huntmaster: "hm", warden: "wd", emissary: "em",
             anthems: "anthems" }[k];
  }
  function togglePerm(p) {
    if (p.always) return;             // a counter, not a switch
    var on = !s[p.key].on;
    sfxAt(on ? ((p.key === "warden" || p.key === "emissary") ? "healerOn" : "permOn") : "permOff", 0);
    act(function () {
      var o = s[p.key];
      o.on = o.on ? 0 : 1;
      if (!o.on && p.ctr) o.ctr = 0;
      if (p.key === "warmaster" && o.on) o.fired = 0;
      if (p.key === "gala" && o.on) { o.mTre = 0; o.mLife = 0; o.mCtr = 0; }
    }, { reset: floatKeyFor(p.key) });
  }
  // Tromell: "{1}, {T}: Proliferate X times, where X is the number of nontoken
  // creatures you control that entered this turn." Proliferate only adds to
  // permanents that ALREADY have a counter, so a plain 1/1 token is untouched.
  function proliferate() {
    act(function () {
      var x = s.ts.ntIn, i;
      if (x <= 0) return;
      for (i = 0; i < s.elfToks.length; i++) if (s.elfToks[i].c > 0) s.elfToks[i].c += x;
      if (s.marwyn.on && s.marwyn.ctr > 0) s.marwyn.ctr += x;
      if (s.gala.on && s.gala.ctr > 0) s.gala.ctr += x;
      if (s.arwen.on && s.arwen.ctr > 0) s.arwen.ctr += x;
      sfxAt("counterUp", 0); sfxAt("counterUp", 0); sfxAt("counterUp", 0);
      notes.push({ key: "tr", text: "proliferate " + x });
    }, { primary: "tr" });
  }

  function buildPerms() {
    var host = document.getElementById("perms");
    host.innerHTML = "";
    PERMS.forEach(function (p) {
      var c = el("div", "perm");
      c.setAttribute("data-perm", p.key);
      if (!p.always) { c.setAttribute("role", "button"); c.setAttribute("tabindex", "0"); }
      else c.style.cursor = "default";
      var nm = el("div", "pn"); nm.textContent = p.name; c.appendChild(nm);
      var midr = el("div", "pmid");
      if (p.ctr) {
        midr.appendChild(btn(MINUS, "Remove a counter from " + p.name, function (e) {
          e.stopPropagation();
          act(function () {
            if (p.always) { s.anthems = Math.max(0, s.anthems - 1); return; }
            var o = s[p.key];
            if (o.ctr > 0) o.ctr--;
            else if (o.on) { o.on = 0; o.ctr = 0; sfxAt("permOff", 0); }
          }, { primary: floatKeyFor(p.key) });
        }, "pmb"));
      }
      var v = el("div", "pv"); v.id = p.fx; v.textContent = "0"; midr.appendChild(v);
      if (p.ctr) {
        midr.appendChild(btn("+", "Add a counter to " + p.name, function (e) {
          e.stopPropagation();
          act(function () {
            if (p.always) { s.anthems++; return; }
            sfxAt("counterUp", 0);
            var o = s[p.key]; if (!o.on) o.on = 1; o.ctr++;
          }, { primary: floatKeyFor(p.key) });
        }, "pmb"));
      }
      if (p.prolif) {
        // Off to the side, never the centre - the centre is the on/off switch.
        midr.appendChild(btn("\u27f3", "Proliferate with Tromell", function (e) {
          e.stopPropagation(); proliferate();
        }, "pmb"));
      }
      c.appendChild(midr);
      var sub = el("div", "ps"); sub.setAttribute("data-sub", p.key); c.appendChild(sub);
      c.addEventListener("click", function () { togglePerm(p); });
      c.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); togglePerm(p); }
      });
      host.appendChild(c);
    });
  }

  function paintPerms() {
    PERMS.forEach(function (p) {
      var c = document.querySelector('[data-perm="' + p.key + '"]');
      if (p.always) {
        c.classList.add("on"); c.classList.remove("off");
        document.getElementById(p.fx).textContent = "+" + s.anthems;
        c.querySelector('[data-sub="' + p.key + '"]').textContent = p.note;
        return;
      }
      var o = s[p.key];
      c.classList.toggle("on", !!o.on);
      c.classList.toggle("off", !o.on);
      c.setAttribute("aria-pressed", o.on ? "true" : "false");
      document.getElementById(p.fx).textContent = o.on ? p.val() : DASH;
      var sub = c.querySelector('[data-sub="' + p.key + '"]');
      if (o.on && p.key === "marwyn") sub.innerHTML = "1+" + o.ctr + "c+" + s.anthems + "a";
      else if (o.on && p.key === "arwen") sub.innerHTML = "1+" + o.ctr + "c+" + s.anthems + "a";
      else if (o.on && p.key === "bramble") sub.innerHTML = "<b>+1 warriors</b>";
      else if (o.on && p.key === "gala") {
        sub.innerHTML = (o.mTre ? "<s>TRE</s>" : "<b>TRE</b>") + " " +
                        (o.mLife ? "<s>LIF</s>" : "<b>LIF</b>") + " " +
                        (o.mCtr ? "<s>CTR</s>" : "<b>CTR</b>");
      } else if (o.on && p.key === "warmaster") sub.innerHTML = o.fired ? "<s>used</s>" : "<b>ready</b>";
      else sub.textContent = p.note;
    });
  }

  /* ---------- per-turn statistics + log ---------- */
  function pair(up, dn) {
    return '<span class="up">+' + up + '</span><span class="sep">/</span><span class="dn">' + MINUS + dn + '</span>';
  }
  function paintStats() {
    document.getElementById("turnNo").textContent = s.turn;
    document.getElementById("turnTop").innerHTML = "Turn <b>" + s.turn + "</b>";
    document.getElementById("fx-cIn").textContent = "+" + s.ts.cIn;
    document.getElementById("fx-cOut").textContent = MINUS + s.ts.cOut;
    document.getElementById("fx-eIn").textContent = "+" + s.ts.eIn;
    document.getElementById("fx-eOut").textContent = MINUS + s.ts.eOut;
    document.getElementById("fx-life").textContent = "+" + s.ts.life;
    var box = document.getElementById("logbox");
    box.innerHTML = "";
    function line(t, o, cur) {

        "; Elves " + pair(o.eIn, o.eOut) +
        '; life <span class="up">+' + o.life + "</span>" + (cur ? "  (current)" : "");
      return d;
    }
    for (var i = s.log.length - 1; i >= 0; i--) box.appendChild(line(s.log[i].t, s.log[i], false));
    box.insertBefore(line(s.turn, s.ts, true), box.firstChild);
  }

  /* ---------- token detail view ----------
     Sorted the way Anthony reads the board: settled tokens first, freshly
     arrived (summoning sick) last, age order within each group. */
  function tokenOrder() {
    var idx = [], i;
    for (i = 0; i < s.elfToks.length; i++) idx.push(i);
    idx.sort(function (a, c) {
      var d = s.elfToks[a].k - s.elfToks[c].k;
      return d !== 0 ? d : a - c;
    });
    return idx;
  }
  function renderDetail() {
    var grid = document.getElementById("tokgrid");
    var sum = document.getElementById("dsum");
    grid.innerHTML = "";
    sum.innerHTML = "<b>" + s.elfToks.length + "</b> tokens &middot; " +
      elfUpCount() + " up &middot; " + elfTapCount() + " tapped &middot; " +
      elfSickCount() + " sick &middot; +" + s.anthems + " anthem";

    var bulk = document.getElementById("dbulk");
    bulk.innerHTML = "";
    bulk.appendChild(btn("Untap all", "Untap all Elf Warrior tokens", function () {
      sfxAt("tokUntap", 0);
      act(function () { s.elfToks.forEach(function (t) { t.t = 0; }); });
    }));
    bulk.appendChild(btn("+1 ctr all", "Add a counter to every Elf Warrior token", function () {
      act(function () { s.elfToks.forEach(function (t) { t.c++; }); });
    }));
    bulk.appendChild(btn(MINUS + "1 ctr all", "Remove a counter from every Elf Warrior token", function () {
      act(function () { s.elfToks.forEach(function (t) { t.c = Math.max(0, t.c - 1); }); });
    }));
    bulk.appendChild(btn("+ token", "Add one Elf Warrior token", function () {
      act(function () { elfTokenEnters(0); });
    }));

    if (!s.elfToks.length) {
      var e = el("div", "dempty");
      e.textContent = "No Elf Warrior tokens on the battlefield.";
      grid.appendChild(e);
      return;
    }

    tokenOrder().forEach(function (i) {
      var t = s.elfToks[i];
      var pt = tokenPT(t);
      var cell = el("div", "tokcell" + (t.t ? " tapped" : "") + (t.k ? " sick" : ""));
      cell.setAttribute("aria-label", pt + "/" + pt + (t.t ? ", tapped" : ", untapped") +
        (t.k ? ", summoning sick" : "") + (t.c ? ", " + t.c + " counters" : ""));

      var face = el("div", "card up art-elf");
      face.innerHTML = '<div class="bar"></div><div class="win"><span class="cn">' +

      if (t.c > 0) { var cc = el("div", "tctr"); cc.textContent = "+" + t.c; cell.appendChild(cc); }

      cell.appendChild(btn(CROSS, "Remove this token", function (e) {
        e.stopPropagation();
        sfxAt("tokDie", 0);
        act(function () { s.elfToks.splice(i, 1); s.ts.cOut++; s.ts.eOut++; }, { primary: "elfUp" });
      }, "tkill"));

      var top = el("div", "tzone tup"); top.textContent = "+";
      top.addEventListener("click", function (e) { e.stopPropagation(); sfxAt("counterUp", 0); act(function () { s.elfToks[i].c++; }); });
      cell.appendChild(top);

      var midz = el("div", "tmidzone");
      midz.addEventListener("click", function () {
        sfxAt(s.elfToks[i].t ? "tokUntap" : "tokTap", 0);
        act(function () { s.elfToks[i].t = s.elfToks[i].t ? 0 : 1; });
      });
      cell.appendChild(midz);

      var bot = el("div", "tzone tdn"); bot.textContent = MINUS;
      bot.addEventListener("click", function (e) {
        e.stopPropagation();
        act(function () {
          // Same gesture as Marwyn: strip the last counter and the next press
          // takes the token off the battlefield. Undo is in the header for slips.
          if (s.elfToks[i].c > 0) s.elfToks[i].c--;
          else { s.elfToks.splice(i, 1); s.ts.cOut++; s.ts.eOut++; sfxAt("tokDie", 0); }
        }, { primary: "elfUp" });
      });
      cell.appendChild(bot);

      grid.appendChild(cell);
    });
  }

  function showDetail() { document.body.classList.add("detail-open"); clearFloats(); renderDetail(); }
  function hideDetail() { document.body.classList.remove("detail-open"); }
  document.getElementById("detailBtn").addEventListener("click", function () {
    showDetail();
    try { history.pushState({ d: 1 }, "", "#tokens"); } catch (e) { /* file:// fallback */ }
  });
  document.getElementById("backBtn").addEventListener("click", function () {
    if (history.state && history.state.d) history.back(); else hideDetail();
  });
  window.addEventListener("popstate", function () {
    if (!(history.state && history.state.d)) hideDetail();
  });

  /* ---------- render ---------- */
  var elfEls = null, treEls = null;

  function render() {
    document.getElementById("green").textContent = s.green;
    document.getElementById("colorless").textContent = s.colorless;
    document.getElementById("tElves").textContent = allElves();
    document.getElementById("tCreatures").textContent = allCreatures();

    ROWS.forEach(function (r) {
      document.querySelector('[data-n="' + r.key + '"]').textContent = s[r.key];
      var sk = document.querySelector('[data-sick="' + r.sickKey + '"]');
      sk.textContent = s[r.sickKey] > 0 ? s[r.sickKey] + " sick" : "";
      sk.classList.toggle("on", s[r.sickKey] > 0);
    });

    if (elfEls) {
      var u = elfUpCount(), tp = elfTapCount(), sk2 = elfSickCount();
      elfEls.up.querySelector("[data-elfup]").textContent = u;
      elfEls.tp.querySelector("[data-elftap]").textContent = tp;
      elfEls.up.classList.toggle("zero", u === 0);
      elfEls.tp.classList.toggle("zero", tp === 0);
      var se = elfEls.up.querySelector("[data-elfsick]");
      se.textContent = sk2 > 0 ? sk2 + " sick" : "";
      se.classList.toggle("on", sk2 > 0);
    }
    if (treEls) {
      var t = s[treEls.key];
      treEls.up.querySelector("[data-up]").textContent = t.up;
      treEls.tp.querySelector("[data-tapped]").textContent = t.tapped;
      treEls.up.classList.toggle("zero", t.up === 0);
      treEls.tp.classList.toggle("zero", t.tapped === 0);
    }

    paintPerms();
    paintStats();
    if (document.body.classList.contains("detail-open")) renderDetail();
    document.getElementById("undo").disabled = !hist.length;
    document.getElementById("undo2").disabled = !hist.length;
    save();
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("[data-mana]"), function (x) {
    x.addEventListener("click", function () {
      var k = x.getAttribute("data-mana"), d = parseInt(x.getAttribute("data-d"), 10);
      sfxAt(d > 0 ? "manaAdd" : "coin", 0);
      act(function () { s[k] = Math.max(0, s[k] + d); }, { primary: k });
    });
  });
  (function () {
    var b = document.getElementById("sound");
    function paint() { b.textContent = sfxMuted ? "Muted" : "Sound"; b.className = sfxMuted ? "" : "primary"; }
    b.addEventListener("click", function () {
      sfxMuted = !sfxMuted;
      try { localStorage.setItem("elfball_mute", sfxMuted ? "1" : "0"); } catch (e) {}
      paint();
      if (!sfxMuted) sfx("elfDeploy", 0.6);   // confirm it is back on
    });
    paint();
  })();
  document.getElementById("undo").addEventListener("click", undo);
  document.getElementById("undo2").addEventListener("click", undo);

  document.getElementById("newturn").addEventListener("click", function () {
    sfxAt("newTurn", 0);
    act(function () {
      s.log.push({ t: s.turn, cIn: s.ts.cIn, cOut: s.ts.cOut, eIn: s.ts.eIn, eOut: s.ts.eOut, life: s.ts.life });
      if (s.log.length > 60) s.log.shift();
      s.turn++;
      s.ts = { cIn: 0, cOut: 0, eIn: 0, eOut: 0, life: 0, ntIn: 0 };
      s.warmaster.fired = 0;
      s.gala.mTre = 0; s.gala.mLife = 0; s.gala.mCtr = 0;
      s.contrib = { wm: 0, hm: 0, wd: 0, em: 0, bp: 0, ar: 0 };
      s.green = 0; s.colorless = 0;
      s.elvesSick = 0; s.othersSick = 0;
      s.elfToks.forEach(function (t) { t.t = 0; t.k = 0; });
      s.treTok.up += s.treTok.tapped; s.treTok.tapped = 0; s.treTok.sick = 0;
    }, { silent: true });
  });
  document.getElementById("newgame").addEventListener("click", function () {
    sfxAt("newGame", 0);
    act(function () { s = clone(DEFAULT); }, { silent: true });
  });

  buildRows();
  elfEls = buildElfRow();
  treEls = buildToken("treTok", "Treasure", false, "art-tre", "fx-treTok-up", "fx-treTok-tap", false, true);
  buildPerms();
  render();
  hist.length = 0;
  document.getElementById("undo").disabled = true;
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js")["catch"](function () {});
  });
}
</script>

</body>
</html>
